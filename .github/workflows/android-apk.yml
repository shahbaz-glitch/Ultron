name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RMLUI_VERSION: "6.3"
  SDL_VERSION: "3.4.16"
  SDL_IMAGE_VERSION: "3.4.6"
  FREETYPE_VERSION: "VER-2-14-1"

  ANDROID_API: "35"
  ANDROID_NDK_VERSION: "28.2.13676358"

  APP_NAME: "Personal AI"

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout YOUR repository
      # ------------------------------------------------------------
      - name: Checkout application repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Java
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ------------------------------------------------------------
      # 3. Android SDK / NDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ------------------------------------------------------------
      # 4. Fresh dependency clones
      #
      # IMPORTANT:
      # Your repository's existing RmlUi is NOT used.
      # Everything below is placed in RUNNER_TEMP.
      # ------------------------------------------------------------
      - name: Clone fresh SDL3, SDL3_image, FreeType and RmlUi
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_PROJECT="${RUNNER_TEMP}/android-project"

          rm -rf "${ANDROID_PROJECT}"

          # --------------------------------------------------------
          # SDL3
          # --------------------------------------------------------
          git clone \
            --depth 1 \
            --branch "release-${SDL_VERSION}" \
            "https://github.com/libsdl-org/SDL.git" \
            "${RUNNER_TEMP}/SDL"

          # Copy official SDL Android project
          cp -a \
            "${RUNNER_TEMP}/SDL/android-project" \
            "${ANDROID_PROJECT}"

          # --------------------------------------------------------
          # Fresh RmlUi 6.3
          # --------------------------------------------------------
          git clone \
            --depth 1 \
            --branch "${RMLUI_VERSION}" \
            "https://github.com/mikke89/RmlUi.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi"

          # --------------------------------------------------------
          # Fresh SDL3
          # --------------------------------------------------------
          rm -rf "${ANDROID_PROJECT}/app/jni/SDL"

          git clone \
            --depth 1 \
            --branch "release-${SDL_VERSION}" \
            "https://github.com/libsdl-org/SDL.git" \
            "${ANDROID_PROJECT}/app/jni/SDL"

          # --------------------------------------------------------
          # Fresh SDL3_image
          # --------------------------------------------------------
          git clone \
            --depth 1 \
            --branch "release-${SDL_IMAGE_VERSION}" \
            "https://github.com/libsdl-org/SDL_image.git" \
            "${ANDROID_PROJECT}/app/jni/SDL_image"

          # --------------------------------------------------------
          # Fresh FreeType
          # --------------------------------------------------------
          git clone \
            --depth 1 \
            --branch "${FREETYPE_VERSION}" \
            "https://github.com/freetype/freetype.git" \
            "${ANDROID_PROJECT}/app/jni/freetype"

          echo "ANDROID_PROJECT=${ANDROID_PROJECT}" >> "${GITHUB_ENV}"

      # ------------------------------------------------------------
      # 5. Configure official SDL Android project
      # ------------------------------------------------------------
      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Application name
          # --------------------------------------------------------
          sed -i \
            "s#<string name=\"app_name\">Game</string>#<string name=\"app_name\">${APP_NAME}</string>#" \
            "${ANDROID_PROJECT}/app/src/main/res/values/strings.xml"

          # --------------------------------------------------------
          # OpenGL ES 3.2 requirement
          # --------------------------------------------------------
          sed -i \
            's/android:glEsVersion="0x00020000"/android:glEsVersion="0x00030002"/' \
            "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml"

          # --------------------------------------------------------
          # Force C++20 in CMake
          # --------------------------------------------------------
          sed -i \
            's/arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"/arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static", "-DCMAKE_CXX_STANDARD=20", "-DCMAKE_CXX_STANDARD_REQUIRED=ON", "-DCMAKE_CXX_EXTENSIONS=OFF"/' \
            "${ANDROID_PROJECT}/app/build.gradle"

          # --------------------------------------------------------
          # Gradle memory/cache
          # --------------------------------------------------------
          cat > "${ANDROID_PROJECT}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

          # --------------------------------------------------------
          # Root JNI CMake
          # --------------------------------------------------------
          cat > "${ANDROID_PROJECT}/app/jni/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)

          project(PersonalAI LANGUAGES C CXX)

          # ========================================================
          # C++20
          # ========================================================
          set(CMAKE_CXX_STANDARD 20 CACHE STRING "" FORCE)
          set(CMAKE_CXX_STANDARD_REQUIRED ON CACHE BOOL "" FORCE)
          set(CMAKE_CXX_EXTENSIONS OFF CACHE BOOL "" FORCE)

          # Android shared-library/PIC compatibility
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          # ========================================================
          # SDL3
          #
          # SDL3 itself is kept as a shared Android library,
          # matching the official SDL Android project structure.
          # ========================================================
          set(SDL_SHARED ON CACHE BOOL "" FORCE)
          set(SDL_STATIC OFF CACHE BOOL "" FORCE)
          set(SDL_TESTS OFF CACHE BOOL "" FORCE)
          set(SDL_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL_INSTALL OFF CACHE BOOL "" FORCE)
          set(SDL_GPU OFF CACHE BOOL "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/SDL"
              SDL3
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # FreeType
          #
          # Static build.
          #
          # Unneeded optional compression/shaping dependencies are
          # disabled for the first clean Android GUI build.
          # ========================================================
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)

          set(FT_DISABLE_BZIP2 ON CACHE BOOL "" FORCE)
          set(FT_DISABLE_PNG ON CACHE BOOL "" FORCE)
          set(FT_DISABLE_HARFBUZZ ON CACHE BOOL "" FORCE)
          set(FT_DISABLE_BROTLI ON CACHE BOOL "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/freetype"
              freetype
              EXCLUDE_FROM_ALL
          )

          # RmlUi expects this standard CMake target name.
          if(NOT TARGET Freetype::Freetype)
              add_library(Freetype::Freetype ALIAS freetype)
          endif()

          # ========================================================
          # SDL3_image
          #
          # Static build.
          # ========================================================
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)

          set(SDLIMAGE_INSTALL OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_SAMPLES OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_TESTS OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_VENDORED OFF CACHE BOOL "" FORCE)

          # Keep optional image libraries out of this first build.
          set(SDLIMAGE_AVIF OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_BMP OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_GIF OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_JPG OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_JXL OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_LBM OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_PCX OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_PNG OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_PNM OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_QOI OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_SVG OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_TGA OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_TIF OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_WEBP OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_XCF OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_XPM OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_XV OFF CACHE BOOL "" FORCE)

          set(SDLIMAGE_ANI OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_ANI_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_AVIF_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_BMP_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_GIF_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_JPG_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_PNG_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_TGA_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_WEBP_SAVE OFF CACHE BOOL "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/SDL_image"
              SDL3_image
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # RmlUi 6.3
          # ========================================================
          set(RMLUI_SAMPLES OFF CACHE BOOL "" FORCE)
          set(RMLUI_FONT_ENGINE "freetype" CACHE STRING "" FORCE)
          set(RMLUI_PRECOMPILED_HEADERS OFF CACHE BOOL "" FORCE)
          set(RMLUI_LUA_BINDINGS OFF CACHE BOOL "" FORCE)
          set(RMLUI_TRACY_PROFILING OFF CACHE BOOL "" FORCE)
          set(RMLUI_COMPILER_OPTIONS OFF CACHE BOOL "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/RmlUi"
              RmlUi
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # Application
          # ========================================================
          add_subdirectory(src)
          CMAKE

          # --------------------------------------------------------
          # Application CMake
          # --------------------------------------------------------
          cat > "${ANDROID_PROJECT}/app/jni/src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)

          project(PersonalAIApp LANGUAGES CXX)

          add_library(main SHARED

              main.cpp

              # RmlUi SDL platform layer
              ../RmlUi/Backends/RmlUi_Platform_SDL.cpp

              # RmlUi OpenGL 3 renderer
              ../RmlUi/Backends/RmlUi_Renderer_GL3.cpp

              # SDL + OpenGL 3 backend
              ../RmlUi/Backends/RmlUi_Backend_SDL_GL3.cpp
          )

          target_include_directories(main PRIVATE
              ../RmlUi/Backends
          )

          target_compile_features(main PRIVATE
              cxx_std_20
          )

          target_link_libraries(main PRIVATE

              # RmlUi itself
              RmlUi::RmlUi

              # SDL3
              SDL3::SDL3

              # SDL3_image
              SDL3_image::SDL3_image

              # Android system libraries
              android
              log
          )
          CMAKE

          # --------------------------------------------------------
          # Minimal C++20 application
          # --------------------------------------------------------
          cat > "${ANDROID_PROJECT}/app/jni/src/main.cpp" <<'CPP'
          #include <RmlUi/Core/Context.h>
          #include <RmlUi/Core/Core.h>
          #include "RmlUi_Backend.h"

          int main(int argc, char** argv)
          {
              (void)argc;
              (void)argv;

              constexpr int width = 1280;
              constexpr int height = 720;

              // ----------------------------------------------------
              // SDL3 + OpenGL ES 3.2
              // ----------------------------------------------------
              if (!Backend::Initialize(
                      "Personal AI",
                      width,
                      height,
                      false))
              {
                  return 1;
              }

              // ----------------------------------------------------
              // RmlUi interfaces
              // ----------------------------------------------------
              Rml::SetSystemInterface(
                  Backend::GetSystemInterface());

              Rml::SetRenderInterface(
                  Backend::GetRenderInterface());

              if (!Rml::Initialise())
              {
                  Backend::Shutdown();
                  return 2;
              }

              // ----------------------------------------------------
              // RmlUi context
              // ----------------------------------------------------
              Rml::Context* context =
                  Rml::CreateContext(
                      "main",
                      Rml::Vector2i(width, height));

              if (!context)
              {
                  Rml::Shutdown();
                  Backend::Shutdown();
                  return 3;
              }

              // ----------------------------------------------------
              // Embedded RML + RCSS
              // ----------------------------------------------------
              const Rml::String ui = R"rml(
              <rml>
                <head>

                  <style>

                    body
                    {
                      margin: 0px;
                      width: 100%;
                      height: 100%;
                      background-color: #0B1020;
                    }

                    .panel
                    {
                      position: absolute;

                      left: 8%;
                      top: 8%;

                      width: 84%;
                      height: 84%;

                      background-color: #151E38;

                      border: 2px solid #345CFF;

                      border-radius: 24px;
                    }

                    .accent
                    {
                      position: absolute;

                      left: 12%;
                      top: 14%;

                      width: 20%;
                      height: 7%;

                      background-color: #35D0BA;

                      border-radius: 14px;
                    }

                    .card1
                    {
                      position: absolute;

                      left: 12%;
                      top: 30%;

                      width: 34%;
                      height: 22%;

                      background-color: #202C4D;

                      border-radius: 18px;
                    }

                    .card2
                    {
                      position: absolute;

                      right: 12%;
                      top: 30%;

                      width: 34%;
                      height: 22%;

                      background-color: #202C4D;

                      border-radius: 18px;
                    }

                    .bottom
                    {
                      position: absolute;

                      left: 12%;
                      bottom: 14%;

                      width: 76%;
                      height: 8%;

                      background-color: #26365C;

                      border-radius: 16px;
                    }

                  </style>

                </head>

                <body>

                  <div class="panel">

                    <div class="accent"></div>

                    <div class="card1"></div>

                    <div class="card2"></div>

                    <div class="bottom"></div>

                  </div>

                </body>

              </rml>
              )rml";

              // ----------------------------------------------------
              // Load RML
              // ----------------------------------------------------
              Rml::ElementDocument* document =
                  context->LoadDocumentFromMemory(
                      ui,
                      "[embedded-test-ui.rml]");

              if (!document)
              {
                  Rml::RemoveContext("main");
                  Rml::Shutdown();
                  Backend::Shutdown();
                  return 4;
              }

              document->Show();

              // ----------------------------------------------------
              // Main loop
              // ----------------------------------------------------
              while (Backend::ProcessEvents(
                  context,
                  nullptr,
                  false))
              {
                  context->Update();

                  Backend::BeginFrame();

                  context->Render();

                  Backend::PresentFrame();
              }

              // ----------------------------------------------------
              // Shutdown
              // ----------------------------------------------------
              Rml::RemoveContext("main");

              Rml::Shutdown();

              Backend::Shutdown();

              return 0;
          }
          CPP

      # ------------------------------------------------------------
      # 6. Show toolchain versions
      # ------------------------------------------------------------
      - name: Show toolchain versions
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Java ====="
          java -version

          echo
          echo "===== Gradle ====="
          grep "distributionUrl=" \
            "${ANDROID_PROJECT}/gradle/wrapper/gradle-wrapper.properties"

          echo
          echo "===== Android NDK ====="
          ls -1 "${ANDROID_SDK_ROOT}/ndk"

          echo
          echo "===== CMake ====="
          ls -1 "${ANDROID_SDK_ROOT}/cmake" 2>/dev/null || true

          echo
          echo "===== Dependencies ====="
          echo "RmlUi      : ${RMLUI_VERSION}"
          echo "SDL3       : ${SDL_VERSION}"
          echo "SDL3_image : ${SDL_IMAGE_VERSION}"
          echo "FreeType   : ${FREETYPE_VERSION}"

      # ------------------------------------------------------------
      # 7. Build APK
      # ------------------------------------------------------------
      - name: Build APK
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -PBUILD_WITH_CMAKE \
            assembleDebug

      # ------------------------------------------------------------
      # 8. Collect APK
      # ------------------------------------------------------------
      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              "${ANDROID_PROJECT}/app/build/outputs/apk/debug" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          test -n "${APK}"

          cp \
            "${APK}" \
            "${GITHUB_WORKSPACE}/personal-ai-debug.apk"

      # ------------------------------------------------------------
      # 9. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-android-debug
          path: personal-ai-debug.apk
          if-no-files-found: error
