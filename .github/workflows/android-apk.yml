
name: Build Ultron Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "Ultron"
  APPLICATION_ID: "com.shahbazglitch.ultron"

  RMLUI_VERSION: "6.3"
  SDL_VERSION: "3.4.18"
  FREETYPE_VERSION: "VER-2-14-3"
  LUNASVG_VERSION: "3.5.0"

  ANDROID_API: "36"
  ANDROID_MIN_SDK: "26"
  ANDROID_NDK_VERSION: "30.0.16248370"
  ANDROID_ABI: "arm64-v8a"

  BUILD_TOOLS_VERSION: "36.1.0"
  AGP_VERSION: "9.4.0"
  GRADLE_VERSION: "9.8.2"

  APP_VERSION_NAME: "0.1.0"
  APP_VERSION_CODE: "1"

jobs:
  build-android:
    name: Build Ultron
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Ultron
        uses: actions/checkout@v7

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # PREPARE ANDROID PROJECT AND DEPENDENCIES
      # ============================================================

      - name: Prepare Android project and dependencies
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_PROJECT="${RUNNER_TEMP}/android-project"
          export SDL_SOURCE="${RUNNER_TEMP}/SDL"

          rm -rf \
            "${ANDROID_PROJECT}" \
            "${SDL_SOURCE}"

          # SDL3
          git clone \
            --depth 1 \
            --branch "release-${SDL_VERSION}" \
            "https://github.com/libsdl-org/SDL.git" \
            "${SDL_SOURCE}"

          cp -a \
            "${SDL_SOURCE}/android-project" \
            "${ANDROID_PROJECT}"

          cp -a \
            "${SDL_SOURCE}" \
            "${ANDROID_PROJECT}/app/jni/SDL"

          # FreeType
          git clone \
            --depth 1 \
            --branch "${FREETYPE_VERSION}" \
            "https://github.com/freetype/freetype.git" \
            "${ANDROID_PROJECT}/app/jni/freetype"

          # RmlUi
          git clone \
            --depth 1 \
            --branch "${RMLUI_VERSION}" \
            "https://github.com/mikke89/RmlUi.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi"

          # Latest stable LunaSVG, including its PlutoVG source dependency.
          # This dependency is built separately below with the Android NDK,
          # then discovered by app/jni/CMakeLists.txt through lunasvg_ROOT.
          mkdir -p \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Dependencies"

          git clone \
            --depth 1 \
            --recurse-submodules \
            --branch "v${LUNASVG_VERSION}" \
            "https://github.com/sammycage/lunasvg.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Dependencies/lunasvg"

          # Remove downloaded Git metadata.
          rm -rf \
            "${ANDROID_PROJECT}/app/jni/SDL/.git" \
            "${ANDROID_PROJECT}/app/jni/freetype/.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi/.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Dependencies/lunasvg/.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Dependencies/lunasvg/plutovg/.git"

          # Make the project path available to later steps.
          echo "ANDROID_PROJECT=${ANDROID_PROJECT}" >> "${GITHUB_ENV}"

      # ============================================================
      # BUILD LUNASVG FOR THE TARGET ANDROID ABI
      # ============================================================

      - name: Build LunaSVG v${{ env.LUNASVG_VERSION }} for Android
        shell: bash
        run: |
          set -euo pipefail

          LUNASVG_SOURCE="${ANDROID_PROJECT}/app/jni/RmlUi/Dependencies/lunasvg"
          LUNASVG_BUILD="${LUNASVG_SOURCE}/build"
          NDK_TOOLCHAIN="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"

          test -f "${LUNASVG_SOURCE}/CMakeLists.txt"
          test -f "${LUNASVG_SOURCE}/plutovg/CMakeLists.txt"
          test -f "${NDK_TOOLCHAIN}"

          cmake \
            -S "${LUNASVG_SOURCE}" \
            -B "${LUNASVG_BUILD}" \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_TOOLCHAIN}" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="android-${ANDROID_MIN_SDK}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DLUNASVG_BUILD_EXAMPLES=OFF \
            -DPLUTOVG_BUILD_EXAMPLES=OFF

          cmake \
            --build "${LUNASVG_BUILD}" \
            --config Release \
            --target lunasvg \
            --parallel 2

          # The generated package files are consumed by RmlUi's find_package calls.
          test -f "${LUNASVG_BUILD}/lunasvgConfig.cmake"
          test -f "${LUNASVG_BUILD}/lunasvgTargets.cmake"
          test -f "${LUNASVG_BUILD}/plutovg/plutovgConfig.cmake"

          LUNASVG_ARCHIVE="$(
            find "${LUNASVG_BUILD}" \
              -type f \
              -name 'liblunasvg.a' \
              -print -quit
          )"

          PLUTOVG_ARCHIVE="$(
            find "${LUNASVG_BUILD}" \
              -type f \
              -name 'libplutovg.a' \
              -print -quit
          )"

          test -n "${LUNASVG_ARCHIVE}"
          test -n "${PLUTOVG_ARCHIVE}"

          echo "LunaSVG version: ${LUNASVG_VERSION}"
          echo "LunaSVG archive: ${LUNASVG_ARCHIVE}"
          echo "PlutoVG archive: ${PLUTOVG_ARCHIVE}"
          echo "LunaSVG Android build: PASSED"

      # ============================================================
      # CONFIGURE GRADLE PROJECT
      # ============================================================

      - name: Configure Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cat > "${ANDROID_PROJECT}/build.gradle" <<EOF
          plugins {
              id 'com.android.application' version '${AGP_VERSION}' apply false
          }
          EOF

          cat > "${ANDROID_PROJECT}/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Ultron"

          include(":app")
          EOF

          cat > "${ANDROID_PROJECT}/gradle/wrapper/gradle-wrapper.properties" <<EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > "${ANDROID_PROJECT}/app/build.gradle" <<EOF
          plugins {
              id 'com.android.application'
          }

          android {
              namespace = "${APPLICATION_ID}"

              compileSdk = ${ANDROID_API}

              buildToolsVersion = "${BUILD_TOOLS_VERSION}"

              ndkVersion = "${ANDROID_NDK_VERSION}"

              defaultConfig {
                  applicationId = "${APPLICATION_ID}"

                  minSdk = ${ANDROID_MIN_SDK}

                  targetSdk = ${ANDROID_API}

                  versionCode = ${APP_VERSION_CODE}

                  versionName = "${APP_VERSION_NAME}"

                  externalNativeBuild {
                      cmake {
                          arguments "-DANDROID_PLATFORM=android-${ANDROID_MIN_SDK}", "-DANDROID_STL=c++_static"

                          abiFilters "${ANDROID_ABI}"
                      }
                  }
              }

              buildTypes {
                  debug {
                      debuggable true
                  }

                  release {
                      minifyEnabled false

                      proguardFiles \
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                  }
              }

              externalNativeBuild {
                  cmake {
                      path 'jni/CMakeLists.txt'
                  }
              }

              lint {
                  abortOnError false
              }
          }
          EOF

          cat > "${ANDROID_PROJECT}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

          mkdir -p \
            "${ANDROID_PROJECT}/app/src/main/res/values"

          cat > "${ANDROID_PROJECT}/app/src/main/res/values/strings.xml" <<EOF
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

      # ============================================================
      # ADAPTIVE BRAIN ICON
      # ============================================================

      - name: Generate adaptive brain icon
        shell: bash
        run: |
          set -euo pipefail

          ICON_SOURCE="${GITHUB_WORKSPACE}/.github/assets/ultron_icon_source.png"
          ICON_WORK="${RUNNER_TEMP}/ultron-icon"

          test -f "${ICON_SOURCE}"

          if command -v magick >/dev/null 2>&1; then
              MAGICK="magick"
          elif command -v convert >/dev/null 2>&1; then
              MAGICK="convert"
          else
              sudo apt-get update
              sudo apt-get install -y imagemagick

              if command -v magick >/dev/null 2>&1; then
                  MAGICK="magick"
              else
                  MAGICK="convert"
              fi
          fi

          rm -rf "${ICON_WORK}"

          mkdir -p \
            "${ICON_WORK}" \
            "${ANDROID_PROJECT}/app/src/main/res/drawable-nodpi" \
            "${ANDROID_PROJECT}/app/src/main/res/mipmap-anydpi-v26"

          "${MAGICK}" \
            "${ICON_SOURCE}" \
            -resize 720x720 \
            "${ICON_WORK}/brain.png"

          "${MAGICK}" \
            -size 1080x1080 \
            xc:none \
            "${ICON_WORK}/foreground_canvas.png"

          "${MAGICK}" \
            "${ICON_WORK}/foreground_canvas.png" \
            "${ICON_WORK}/brain.png" \
            -gravity center \
            -composite \
            "${ANDROID_PROJECT}/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png"

          cat > "${ANDROID_PROJECT}/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <adaptive-icon
              xmlns:android="http://schemas.android.com/apk/res/android">

              <background
                  android:drawable="@android:color/transparent" />

              <foreground
                  android:drawable="@drawable/ic_launcher_foreground" />

          </adaptive-icon>
          EOF

          echo "Adaptive icon: PASSED"

      # ============================================================
      # ANDROID MANIFEST
      # ============================================================

      - name: Generate Android manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:versionCode="${APP_VERSION_CODE}"
              android:versionName="${APP_VERSION_NAME}"
              android:installLocation="auto">

              <uses-feature
                  android:glEsVersion="0x00030002"
                  android:required="true" />

              <uses-feature
                  android:name="android.hardware.touchscreen"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.bluetooth"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.gamepad"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="false" />

              <uses-feature
                  android:name="android.hardware.type.pc"
                  android:required="false" />

              <uses-permission
                  android:name="android.permission.VIBRATE" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:enableOnBackInvokedCallback="false">

                  <activity
                      android:name="org.libsdl.app.SDLActivity"
                      android:label="@string/app_name"
                      android:alwaysRetainTaskState="true"
                      android:launchMode="singleInstance"
                      android:configChanges="layoutDirection|locale|grammaticalGender|fontScale|fontWeightAdjustment|orientation|uiMode|screenLayout|screenSize|smallestScreenSize|keyboard|keyboardHidden|navigation"
                      android:preferMinimalPostProcessing="true"
                      android:exported="true">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ============================================================
      # INSTALL NATIVE SOURCES, ACTIONS, UI AND FONTS
      # ============================================================

      - name: Install native sources, actions, UI and fonts
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_CMAKE="${GITHUB_WORKSPACE}/.github/CMakeLists.txt"
          SOURCE_CPP="${GITHUB_WORKSPACE}/.github/main.cpp"

          # Font diagnostics header is a required native source dependency.
          SOURCE_FONT_DIAGNOSTICS="${GITHUB_WORKSPACE}/.github/FontDiagnostics.h"

          # Prefer root folders, but support the existing repository paths.
          SOURCE_ACTION=""

          for candidate in \
            "${GITHUB_WORKSPACE}/action" \
            "${GITHUB_WORKSPACE}/.github/action"; do

            if [[ -d "${candidate}" ]]; then
              SOURCE_ACTION="${candidate}"
              break
            fi
          done

          SOURCE_UI=""

          for candidate in \
            "${GITHUB_WORKSPACE}/ui" \
            "${GITHUB_WORKSPACE}/.github/ui"; do

            if [[ -d "${candidate}" ]]; then
              SOURCE_UI="${candidate}"
              break
            fi
          done

          # Font files are stored in .github/fonts.
          SOURCE_FONTS="${GITHUB_WORKSPACE}/.github/fonts"

          # Core native source files are required.
          test -f "${SOURCE_CMAKE}"
          test -f "${SOURCE_CPP}"
          test -f "${SOURCE_FONT_DIAGNOSTICS}"

          NATIVE_DIR="${ANDROID_PROJECT}/app/jni"
          ASSETS_UI="${ANDROID_PROJECT}/app/src/main/assets/ui"
          ASSETS_FONTS="${ANDROID_PROJECT}/app/src/main/assets/fonts"

          test -d "${NATIVE_DIR}"

          # Install native build files.
          cp \
            "${SOURCE_CMAKE}" \
            "${NATIVE_DIR}/CMakeLists.txt"

          cp \
            "${SOURCE_CPP}" \
            "${NATIVE_DIR}/main.cpp"

          # Install the font diagnostics header beside main.cpp.
          cp \
            "${SOURCE_FONT_DIAGNOSTICS}" \
            "${NATIVE_DIR}/FontDiagnostics.h"

          # Always create destination directories.
          mkdir -p \
            "${NATIVE_DIR}/action" \
            "${NATIVE_DIR}/ui" \
            "${ASSETS_UI}" \
            "${ASSETS_FONTS}"

          # Copy Actions only when the source folder exists.
          if [[ -n "${SOURCE_ACTION}" ]]; then
            echo "Action source: ${SOURCE_ACTION}"

            cp -a \
              "${SOURCE_ACTION}/." \
              "${NATIVE_DIR}/action/"
          else
            echo "No action folder supplied. Continuing without custom Actions."
          fi

          # Copy UI resources only when the source folder exists.
          if [[ -n "${SOURCE_UI}" ]]; then
            echo "UI source: ${SOURCE_UI}"

            cp -a \
              "${SOURCE_UI}/." \
              "${NATIVE_DIR}/ui/"

            cp -a \
              "${SOURCE_UI}/." \
              "${ASSETS_UI}/"
          else
            echo "No UI folder supplied. Continuing without external UI files."
          fi

          # Copy font resources into Android APK assets.
          if [[ -d "${SOURCE_FONTS}" ]]; then
            echo "Font source: ${SOURCE_FONTS}"

            cp -a \
              "${SOURCE_FONTS}/." \
              "${ASSETS_FONTS}/"
          else
            echo "No fonts folder supplied. Continuing without external fonts."
          fi

          echo
          echo "========================================"
          echo "DISCOVERED ACTION SOURCES"
          echo "========================================"

          find "${NATIVE_DIR}/action" \
            -type f \
            -name '*.cpp' \
            -print

          ACTION_COUNT="$(
            find "${NATIVE_DIR}/action" \
              -type f \
              -name '*.cpp' \
              -print | wc -l
          )"

          echo "Action .cpp files: ${ACTION_COUNT}"

          echo
          echo "========================================"
          echo "AVAILABLE UI RESOURCES"
          echo "========================================"

          find "${ASSETS_UI}" -type f -print

          UI_COUNT="$(
            find "${ASSETS_UI}" \
              -type f \
              -print | wc -l
          )"

          echo "UI resource files: ${UI_COUNT}"

          echo
          echo "========================================"
          echo "AVAILABLE FONT RESOURCES"
          echo "========================================"

          find "${ASSETS_FONTS}" -type f -print

          FONT_COUNT="$(
            find "${ASSETS_FONTS}" \
              -type f \
              \( -iname '*.ttf' -o -iname '*.otf' \) \
              -print | wc -l
          )"

          echo "TTF/OTF font files: ${FONT_COUNT}"

          echo
          echo "========================================"
          echo "FONT DIAGNOSTICS HEADER"
          echo "========================================"

          test -f "${NATIVE_DIR}/FontDiagnostics.h"

          echo "FontDiagnostics.h copied successfully."
          echo "Native diagnostic header staging: PASSED"

          echo
          echo "Native sources, UI and font resources staged successfully."

      # ============================================================
      # VERIFY GENERATED PROJECT
      # ============================================================

      - name: Verify generated project
        shell: bash
        run: |
          set -euo pipefail

          NATIVE_DIR="${ANDROID_PROJECT}/app/jni"
          ASSETS_UI="${ANDROID_PROJECT}/app/src/main/assets/ui"
          ASSETS_FONTS="${ANDROID_PROJECT}/app/src/main/assets/fonts"
          SOURCE_FONTS="${GITHUB_WORKSPACE}/.github/fonts"
          LUNASVG_SOURCE="${NATIVE_DIR}/RmlUi/Dependencies/lunasvg"
          LUNASVG_BUILD="${LUNASVG_SOURCE}/build"

          echo "========================================"
          echo "ULTRON CONFIGURATION"
          echo "========================================"

          echo "Application : ${APP_NAME}"
          echo "Package     : ${APPLICATION_ID}"
          echo "Version     : ${APP_VERSION_NAME}"
          echo "RmlUi       : ${RMLUI_VERSION}"
          echo "SDL3        : ${SDL_VERSION}"
          echo "FreeType    : ${FREETYPE_VERSION}"
          echo "LunaSVG     : ${LUNASVG_VERSION}"
          echo "Android API : ${ANDROID_API}"
          echo "Min SDK     : ${ANDROID_MIN_SDK}"
          echo "Build Tools : ${BUILD_TOOLS_VERSION}"
          echo "AGP         : ${AGP_VERSION}"
          echo "Gradle      : ${GRADLE_VERSION}"
          echo "NDK         : ${ANDROID_NDK_VERSION}"
          echo "ABI         : ${ANDROID_ABI}"
          echo "C++         : 20"
          echo "Renderer    : OpenGL ES 3.2"
          echo "Background  : Pure Black"
          echo "Icon        : Adaptive Brain Icon"

          echo
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          test -f "${ANDROID_PROJECT}/build.gradle"
          test -f "${ANDROID_PROJECT}/settings.gradle"
          test -f "${ANDROID_PROJECT}/gradle/wrapper/gradle-wrapper.properties"
          test -f "${ANDROID_PROJECT}/gradlew"
          test -f "${ANDROID_PROJECT}/app/build.gradle"
          test -f "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml"
          test -f "${ANDROID_PROJECT}/app/src/main/res/values/strings.xml"
          test -f "${ANDROID_PROJECT}/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png"
          test -f "${ANDROID_PROJECT}/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"

          test -f "${NATIVE_DIR}/CMakeLists.txt"
          test -f "${NATIVE_DIR}/main.cpp"
          test -f "${NATIVE_DIR}/FontDiagnostics.h"

          test -d "${NATIVE_DIR}/action"
          test -d "${NATIVE_DIR}/ui"
          test -d "${ASSETS_UI}"
          test -d "${ASSETS_FONTS}"

          echo "Project files: PASSED"
          echo "FontDiagnostics.h: PASSED"

          echo
          echo "========================================"
          echo "DEPENDENCIES"
          echo "========================================"

          test -f "${NATIVE_DIR}/SDL/include/SDL3/SDL.h"
          test -f "${NATIVE_DIR}/SDL/include/SDL3/SDL_main.h"
          test -f "${NATIVE_DIR}/RmlUi/CMakeLists.txt"
          test -f "${NATIVE_DIR}/RmlUi/Backends/RmlUi_Platform_SDL.cpp"
          test -f "${NATIVE_DIR}/RmlUi/Backends/RmlUi_Renderer_GL3.cpp"
          test -f "${NATIVE_DIR}/RmlUi/Include/RmlUi/Core/Context.h"
          test -f "${NATIVE_DIR}/RmlUi/Include/RmlUi/Core/ElementDocument.h"
          test -f "${NATIVE_DIR}/freetype/CMakeLists.txt"

          # Verify the pinned SVG source and its Android build-tree packages.
          test -f "${LUNASVG_SOURCE}/CMakeLists.txt"
          test -f "${LUNASVG_SOURCE}/plutovg/CMakeLists.txt"
          test -f "${LUNASVG_BUILD}/lunasvgConfig.cmake"
          test -f "${LUNASVG_BUILD}/lunasvgTargets.cmake"
          test -f "${LUNASVG_BUILD}/plutovg/plutovgConfig.cmake"

          test -n "$(
            find "${LUNASVG_BUILD}" \
              -type f \
              -name 'liblunasvg.a' \
              -print -quit
          )"

          test -n "$(
            find "${LUNASVG_BUILD}" \
              -type f \
              -name 'libplutovg.a' \
              -print -quit
          )"

          echo "SDL/FreeType/RmlUi dependencies: PASSED"
          echo "SVG dependency (LunaSVG ${LUNASVG_VERSION} + PlutoVG): PASSED"

          echo
          echo "========================================"
          echo "ACTION SOURCE DISCOVERY"
          echo "========================================"

          grep -q 'ULTRON_ACTION_DIR' \
            "${NATIVE_DIR}/CMakeLists.txt"

          grep -q 'ULTRON_ACTION_SOURCES' \
            "${NATIVE_DIR}/CMakeLists.txt"

          grep -q 'GLOB_RECURSE' \
            "${NATIVE_DIR}/CMakeLists.txt"

          ACTION_COUNT="$(
            find "${NATIVE_DIR}/action" \
              -type f \
              -name '*.cpp' \
              -print | wc -l
          )"

          echo "CMake action discovery: PASSED"
          echo "Discovered Action .cpp files: ${ACTION_COUNT}"

          if [[ -f "${NATIVE_DIR}/action/DotAction.cpp" ]]; then
            echo "Test Action detected."

            grep -q 'Ultron_RegisterAction' \
              "${NATIVE_DIR}/action/DotAction.cpp"

            grep -q 'Ultron_SetElementClass' \
              "${NATIVE_DIR}/action/DotAction.cpp"

            echo "Test Action checks: PASSED"
          else
            echo "DotAction.cpp not supplied. Continuing normally."
          fi

          echo
          echo "========================================"
          echo "OPTIONAL UI SOURCE AND APK ASSETS"
          echo "========================================"

          if [[ -f "${NATIVE_DIR}/ui/home.rml" ]]; then
            test -f "${ASSETS_UI}/home.rml"
            echo "home.rml: supplied and staged"
          else
            echo "home.rml: not supplied; external home document is optional"
          fi

          if [[ -f "${NATIVE_DIR}/ui/home.rcss" ]]; then
            test -f "${ASSETS_UI}/home.rcss"
            echo "home.rcss: supplied and staged"
          else
            echo "home.rcss: not supplied; stylesheet is optional"
          fi

          UI_COUNT="$(
            find "${ASSETS_UI}" \
              -type f \
              -print | wc -l
          )"

          echo "Total staged UI resources: ${UI_COUNT}"
          echo "UI staging verification: PASSED"

          echo
          echo "========================================"
          echo "FONT SOURCE AND APK ASSET STAGING"
          echo "========================================"

          if [[ -d "${SOURCE_FONTS}" ]]; then
            while IFS= read -r -d '' FONT_FILE; do
              FONT_RELATIVE="${FONT_FILE#${SOURCE_FONTS}/}"

              test -f "${ASSETS_FONTS}/${FONT_RELATIVE}"

              echo "Font staged: ${FONT_RELATIVE}"

            done < <(
              find "${SOURCE_FONTS}" \
                -type f \
                -print0
            )
          else
            echo "No font source folder supplied."
          fi

          FONT_COUNT="$(
            find "${ASSETS_FONTS}" \
              -type f \
              \( -iname '*.ttf' -o -iname '*.otf' \) \
              -print | wc -l
          )"

          echo "Staged TTF/OTF fonts: ${FONT_COUNT}"
          echo "Font staging verification: PASSED"

          echo
          echo "========================================"
          echo "FONT DIAGNOSTIC INTEGRATION"
          echo "========================================"

          test -f "${NATIVE_DIR}/FontDiagnostics.h"

          grep -Fq \
            '#include "FontDiagnostics.h"' \
            "${NATIVE_DIR}/main.cpp"

          grep -Fq \
            'UltronFontDiagnostics::RunPreflight' \
            "${NATIVE_DIR}/main.cpp"

          grep -Fq \
            'UltronFontDiagnostics::CreateRenderProbe' \
            "${NATIVE_DIR}/main.cpp"

          grep -Fq \
            'UltronFontDiagnostics::CheckRenderedGlyphPixels' \
            "${NATIVE_DIR}/main.cpp"

          grep -Fq \
            'UltronFontDiagnostics::PrintFinalReport' \
            "${NATIVE_DIR}/main.cpp"

          echo "Font diagnostic header: PASSED"
          echo "Font diagnostic startup: PASSED"
          echo "FreeType preflight integration: PASSED"
          echo "RmlUi render probe integration: PASSED"
          echo "OpenGL pixel test integration: PASSED"

          echo
          echo "========================================"
          echo "GRADLE / TOOLCHAIN"
          echo "========================================"

          grep -q \
            "com.android.application' version '${AGP_VERSION}'" \
            "${ANDROID_PROJECT}/build.gradle"

          grep -q \
            "gradle-${GRADLE_VERSION}-bin.zip" \
            "${ANDROID_PROJECT}/gradle/wrapper/gradle-wrapper.properties"

          grep -q \
            "compileSdk = ${ANDROID_API}" \
            "${ANDROID_PROJECT}/app/build.gradle"

          grep -q \
            "minSdk = ${ANDROID_MIN_SDK}" \
            "${ANDROID_PROJECT}/app/build.gradle"

          grep -q \
            "targetSdk = ${ANDROID_API}" \
            "${ANDROID_PROJECT}/app/build.gradle"

          grep -q \
            "buildToolsVersion = \"${BUILD_TOOLS_VERSION}\"" \
            "${ANDROID_PROJECT}/app/build.gradle"

          grep -q \
            "ndkVersion = \"${ANDROID_NDK_VERSION}\"" \
            "${ANDROID_PROJECT}/app/build.gradle"

          echo "Gradle/toolchain configuration: PASSED"

          echo
          echo "========================================"
          echo "NATIVE CONFIGURATION"
          echo "========================================"

          grep -q \
            'RMLUI_SDL_VERSION_MAJOR=3' \
            "${NATIVE_DIR}/CMakeLists.txt"

          grep -q \
            'RMLUI_SVG_PLUGIN' \
            "${NATIVE_DIR}/CMakeLists.txt"

          grep -q \
            'RmlUi::Debugger' \
            "${NATIVE_DIR}/CMakeLists.txt"

          grep -q \
            '#include <SDL3/SDL_main.h>' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            '#include <RmlUi/Core/Context.h>' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            '#include <RmlUi/Core/ElementDocument.h>' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            '#include <GLES3/gl3.h>' \
            "${NATIVE_DIR}/main.cpp"

          # Verify diagnostics header is included by the native source.
          grep -Fq \
            '#include "FontDiagnostics.h"' \
            "${NATIVE_DIR}/main.cpp"

          # Updated checks for the main.cpp touch/lifecycle implementation.
          # SDL_SetEventFilter is no longer required by the current design.
          grep -q \
            'HandleApplicationEvent' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            'SDL_EVENT_FINGER_CANCELED' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            'ProcessTouchCancel' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            'SDL_EVENT_WILL_ENTER_BACKGROUND' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            'SDL_EVENT_DID_ENTER_FOREGROUND' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            'background-color: #000000' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            'glClearColor' \
            "${NATIVE_DIR}/main.cpp"

          grep -q \
            'glClear(' \
            "${NATIVE_DIR}/main.cpp"

          echo "Native CMake and runtime configuration: PASSED"

          echo
          echo "========================================"
          echo "FUTURE HARDWARE FEATURES"
          echo "========================================"

          grep -q \
            'android.hardware.bluetooth' \
            "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml"

          grep -q \
            'android.hardware.gamepad' \
            "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml"

          grep -q \
            'android.hardware.usb.host' \
            "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml"

          grep -q \
            'android.hardware.type.pc' \
            "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml"

          echo "Bluetooth/gamepad/USB/PC declarations: PASSED"

          echo
          echo "========================================"
          echo "ICON"
          echo "========================================"

          grep -q \
            'android:drawable="@android:color/transparent"' \
            "${ANDROID_PROJECT}/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"

          grep -q \
            'android:drawable="@drawable/ic_launcher_foreground"' \
            "${ANDROID_PROJECT}/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"

          echo "Adaptive icon: PASSED"

          echo
          echo "========================================"
          echo "PROJECT VERIFICATION PASSED"
          echo "========================================"

      # ============================================================
      # GRADLE CONFIGURATION TEST
      # ============================================================

      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${ANDROID_PROJECT}"

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            help

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${ANDROID_PROJECT}"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            assembleDebug \
            2>&1 | tee "${RUNNER_TEMP}/gradle-build.log"

      # ============================================================
      # VERIFY APK OUTPUT
      # ============================================================

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="${ANDROID_PROJECT}/app/build/outputs/apk/debug/app-debug.apk"

          test -f "${APK}"

          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          echo "APK exists:"
          echo "${APK}"

          echo
          ls -lh "${APK}"

      # ============================================================
      # PREPARE APK ARTIFACT
      # ============================================================

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail

          APK="${ANDROID_PROJECT}/app/build/outputs/apk/debug/app-debug.apk"

          test -f "${APK}"

          mkdir -p \
            "${GITHUB_WORKSPACE}/artifacts"

          cp \
            "${APK}" \
            "${GITHUB_WORKSPACE}/artifacts/ultron-debug.apk"

          test -f \
            "${GITHUB_WORKSPACE}/artifacts/ultron-debug.apk"

          echo "APK prepared successfully."

      # ============================================================
      # VALIDATE APK
      # UI AND FONT ASSETS ARE OPTIONAL
      # ============================================================

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${GITHUB_WORKSPACE}/artifacts/ultron-debug.apk"
          BADGING="${RUNNER_TEMP}/apk-badging.txt"
          APK_CONTENTS="${RUNNER_TEMP}/apk-contents.txt"
          ASSETS_UI="${ANDROID_PROJECT}/app/src/main/assets/ui"
          ASSETS_FONTS="${ANDROID_PROJECT}/app/src/main/assets/fonts"

          test -f "${APK}"

          echo "========================================"
          echo "APK BADGING"
          echo "========================================"

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt" \
            dump badging \
            "${APK}" \
            | tee "${BADGING}"

          echo
          echo "========================================"
          echo "PACKAGE"
          echo "========================================"

          grep -q \
            "package: name='${APPLICATION_ID}'" \
            "${BADGING}"

          echo "Package identity: PASSED"

          echo
          echo "========================================"
          echo "APP LABEL"
          echo "========================================"

          grep -q \
            "application-label:'${APP_NAME}'" \
            "${BADGING}"

          echo "Application label: PASSED"

          echo
          echo "========================================"
          echo "ABI"
          echo "========================================"

          grep -q \
            "native-code: '${ANDROID_ABI}'" \
            "${BADGING}"

          echo "ABI: PASSED"

          echo
          echo "========================================"
          echo "OPENGL ES"
          echo "========================================"

          grep -q \
            "uses-gl-es: '0x30002'" \
            "${BADGING}"

          echo "OpenGL ES 3.2: PASSED"

          echo
          echo "========================================"
          echo "SDK"
          echo "========================================"

          grep -q \
            "sdkVersion:'${ANDROID_MIN_SDK}'" \
            "${BADGING}"

          grep -q \
            "targetSdkVersion:'${ANDROID_API}'" \
            "${BADGING}"

          echo "Minimum SDK ${ANDROID_MIN_SDK}: PASSED"
          echo "Target SDK ${ANDROID_API}: PASSED"

          echo
          echo "========================================"
          echo "UI ASSETS INSIDE APK"
          echo "========================================"

          unzip -l "${APK}"

          # Record APK entry names for exact file checks.
          unzip -Z1 "${APK}" > "${APK_CONTENTS}"

          UI_COUNT=0

          # Validate every UI file that was actually supplied.
          # An empty UI directory is allowed.
          while IFS= read -r -d '' UI_FILE; do
            UI_RELATIVE="${UI_FILE#${ASSETS_UI}/}"
            APK_ENTRY="assets/ui/${UI_RELATIVE}"

            if ! grep -Fqx "${APK_ENTRY}" "${APK_CONTENTS}"; then
              echo "::error::UI asset missing from APK: ${APK_ENTRY}"
              exit 1
            fi

            echo "Packaged: ${APK_ENTRY}"
            UI_COUNT=$((UI_COUNT + 1))

          done < <(
            find "${ASSETS_UI}" \
              -type f \
              -print0
          )

          if [[ "${UI_COUNT}" -eq 0 ]]; then
            echo "No external UI assets supplied. This is allowed."
          else
            echo "UI assets packaged successfully: ${UI_COUNT}"
          fi

          echo
          echo "========================================"
          echo "FONT ASSETS INSIDE APK"
          echo "========================================"

          FONT_COUNT=0

          # Validate every supplied font and license file.
          # An empty font directory is allowed.
          while IFS= read -r -d '' FONT_FILE; do
            FONT_RELATIVE="${FONT_FILE#${ASSETS_FONTS}/}"
            APK_ENTRY="assets/fonts/${FONT_RELATIVE}"

            if ! grep -Fqx "${APK_ENTRY}" "${APK_CONTENTS}"; then
              echo "::error::Font asset missing from APK: ${APK_ENTRY}"
              exit 1
            fi

            echo "Packaged: ${APK_ENTRY}"
            FONT_COUNT=$((FONT_COUNT + 1))

          done < <(
            find "${ASSETS_FONTS}" \
              -type f \
              -print0
          )

          if [[ "${FONT_COUNT}" -eq 0 ]]; then
            echo "No external font assets supplied. This is allowed."
          else
            echo "Font assets packaged successfully: ${FONT_COUNT}"
          fi

          echo
          echo "========================================"
          echo "ICON"
          echo "========================================"

          test -f \
            "${ANDROID_PROJECT}/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"

          test -f \
            "${ANDROID_PROJECT}/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png"

          echo "Adaptive icon resources: PASSED"

          echo
          echo "========================================"
          echo "APK VALIDATION PASSED"
          echo "========================================"

          ls -lh "${APK}"

      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload Ultron APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ultron-android-debug
          path: artifacts/ultron-debug.apk
          if-no-files-found: warn
          compression-level: 0

      # ============================================================
      # BUILD SUMMARY
      # ============================================================

      - name: Generate build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Ultron Android Build"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| App | ${APP_NAME} |"
            echo "| Application ID | ${APPLICATION_ID} |"
            echo "| Version | ${APP_VERSION_NAME} |"
            echo "| RmlUi | ${RMLUI_VERSION} |"
            echo "| SDL3 | ${SDL_VERSION} |"
            echo "| FreeType | ${FREETYPE_VERSION} |"
            echo "| LunaSVG | ${LUNASVG_VERSION} |"
            echo "| Android API | ${ANDROID_API} |"
            echo "| Min SDK | ${ANDROID_MIN_SDK} |"
            echo "| Build Tools | ${BUILD_TOOLS_VERSION} |"
            echo "| AGP | ${AGP_VERSION} |"
            echo "| Gradle | ${GRADLE_VERSION} |"
            echo "| NDK | ${ANDROID_NDK_VERSION} |"
            echo "| ABI | ${ANDROID_ABI} |"
            echo "| C++ | 20 |"
            echo "| Renderer | OpenGL ES 3.2 |"
            echo "| SVG | LunaSVG ${LUNASVG_VERSION} + PlutoVG, built for Android |"
            echo "| Visual Debugger | CMake target linked; C++ initialization required |"
            echo "| Action sources | Automatically discovered; optional |"
            echo "| UI resources | Automatically packaged; optional |"
            echo "| Font resources | Automatically packaged from .github/fonts; optional |"
            echo "| Font diagnostics | Header copied and integration verified |"
            echo "| Background | Pure Black fallback |"
            echo "| Icon | Adaptive Brain Icon |"
            echo
            echo "APK artifact: ultron-android-debug"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ============================================================
      # DIAGNOSTICS
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ultron-build-diagnostics
          path: |
            ${{ runner.temp }}/gradle-build.log
            ${{ runner.temp }}/apk-badging.txt
            ${{ runner.temp }}/apk-contents.txt
          if-no-files-found: warn
          compression-level: 6
