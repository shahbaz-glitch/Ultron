name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Personal AI"

  RMLUI_VERSION: "6.3"
  SDL_VERSION: "3.4.16"
  FREETYPE_VERSION: "VER-2-14-1"

  ANDROID_API: "35"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_ABI: "arm64-v8a"

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Ultron
        uses: actions/checkout@v7

      # ============================================================
      # Java 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # Prepare fresh Android project
      # ============================================================

      - name: Prepare Android project and dependencies
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_PROJECT="${RUNNER_TEMP}/android-project"

          rm -rf "${ANDROID_PROJECT}"
          rm -rf "${RUNNER_TEMP}/SDL"
          rm -rf "${RUNNER_TEMP}/RmlUi"
          rm -rf "${RUNNER_TEMP}/freetype"

          # --------------------------------------------------------
          # SDL3 3.4.16
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "release-${SDL_VERSION}" \
            "https://github.com/libsdl-org/SDL.git" \
            "${RUNNER_TEMP}/SDL"

          cp -a \
            "${RUNNER_TEMP}/SDL/android-project" \
            "${ANDROID_PROJECT}"

          rm -rf \
            "${ANDROID_PROJECT}/app/jni/SDL"

          git clone \
            --depth 1 \
            --branch "release-${SDL_VERSION}" \
            "https://github.com/libsdl-org/SDL.git" \
            "${ANDROID_PROJECT}/app/jni/SDL"

          # --------------------------------------------------------
          # FreeType 2.14.1
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "${FREETYPE_VERSION}" \
            "https://github.com/freetype/freetype.git" \
            "${ANDROID_PROJECT}/app/jni/freetype"

          # --------------------------------------------------------
          # RmlUi 6.3
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "${RMLUI_VERSION}" \
            "https://github.com/mikke89/RmlUi.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi"

          # --------------------------------------------------------
          # Remove git metadata
          # --------------------------------------------------------

          rm -rf \
            "${ANDROID_PROJECT}/app/jni/SDL/.git" \
            "${ANDROID_PROJECT}/app/jni/freetype/.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi/.git"

          echo "ANDROID_PROJECT=${ANDROID_PROJECT}" >> "${GITHUB_ENV}"

      # ============================================================
      # Configure Android project
      # ============================================================

      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Application name
          # --------------------------------------------------------

          sed -i \
            's#<string name="app_name">[^<]*</string>#<string name="app_name">Personal AI</string>#' \
            "${ANDROID_PROJECT}/app/src/main/res/values/strings.xml"

          # --------------------------------------------------------
          # OpenGL ES 3.2
          # --------------------------------------------------------

          sed -i \
            's/android:glEsVersion="0x00020000"/android:glEsVersion="0x00030002"/' \
            "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml"

          # --------------------------------------------------------
          # C++20
          # --------------------------------------------------------

          sed -i \
            's/arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"/arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static", "-DCMAKE_CXX_STANDARD=20", "-DCMAKE_CXX_STANDARD_REQUIRED=ON", "-DCMAKE_CXX_EXTENSIONS=OFF"/' \
            "${ANDROID_PROJECT}/app/build.gradle"

          # --------------------------------------------------------
          # Gradle properties
          # --------------------------------------------------------

          cat > "${ANDROID_PROJECT}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

          # ========================================================
          # Main CMakeLists.txt
          # ========================================================

          cat > "${ANDROID_PROJECT}/app/jni/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)

          project(
              PersonalAI
              LANGUAGES C CXX
          )

          # ========================================================
          # C++20
          # ========================================================

          set(
              CMAKE_CXX_STANDARD
              20
              CACHE STRING
              ""
              FORCE
          )

          set(
              CMAKE_CXX_STANDARD_REQUIRED
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              CMAKE_CXX_EXTENSIONS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          set(
              CMAKE_EXPORT_COMPILE_COMMANDS
              ON
              CACHE BOOL
              ""
              FORCE
          )

          # ========================================================
          # RmlUi SDL3 selection
          #
          # RmlUi 6.3 SDL backend needs SDL major version 3.
          # Define it before RmlUi backend sources are compiled.
          # ========================================================

          add_compile_definitions(
              RMLUI_SDL_VERSION_MAJOR=3
          )

          # ========================================================
          # SDL3
          # ========================================================

          set(
              SDL_SHARED
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_STATIC
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_TESTS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_EXAMPLES
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_INSTALL
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_GPU
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/SDL"
              SDL3
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # FreeType
          # ========================================================

          set(
              BUILD_SHARED_LIBS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_ZLIB
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_BZIP2
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_PNG
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_HARFBUZZ
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_BROTLI
              ON
              CACHE BOOL
              ""
              FORCE
          )

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/freetype"
              freetype
              EXCLUDE_FROM_ALL
          )

          if(NOT TARGET Freetype::Freetype)
              add_library(
                  Freetype::Freetype
                  ALIAS
                  freetype
              )
          endif()

          # ========================================================
          # RmlUi 6.3
          # ========================================================

          set(
              BUILD_SHARED_LIBS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_SAMPLES
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_FONT_ENGINE
              "freetype"
              CACHE STRING
              ""
              FORCE
          )

          set(
              RMLUI_PRECOMPILED_HEADERS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_LUA_BINDINGS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_TRACY_PROFILING
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_COMPILER_OPTIONS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/RmlUi"
              RmlUi
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # Application
          # ========================================================

          add_subdirectory(src)
          CMAKE

          # ========================================================
          # Application CMakeLists.txt
          # ========================================================

          mkdir -p "${ANDROID_PROJECT}/app/jni/src"

          cat > "${ANDROID_PROJECT}/app/jni/src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)

          project(
              PersonalAIApp
              LANGUAGES CXX
          )

          add_library(
              main
              SHARED

              main.cpp

              ../RmlUi/Backends/RmlUi_Platform_SDL.cpp
              ../RmlUi/Backends/RmlUi_Renderer_GL3.cpp
          )

          # ========================================================
          # Include directories
          # ========================================================

          target_include_directories(
              main
              PRIVATE

              ../RmlUi/Backends
          )

          # ========================================================
          # C++20
          # ========================================================

          target_compile_features(
              main
              PRIVATE
              cxx_std_20
          )

          # ========================================================
          # SDL3 definition
          # ========================================================

          target_compile_definitions(
              main
              PRIVATE
              RMLUI_SDL_VERSION_MAJOR=3
          )

          # ========================================================
          # Libraries
          # ========================================================

          target_link_libraries(
              main
              PRIVATE

              RmlUi::RmlUi

              SDL3::SDL3-shared

              GLESv3
              android
              log
              ${CMAKE_DL_LIBS}
          )
          CMAKE

          # ========================================================
          # Main application source
          # ========================================================

          cat > "${ANDROID_PROJECT}/app/jni/src/main.cpp" <<'CPP'
          #include <SDL3/SDL.h>

          #include <RmlUi/Core/Context.h>
          #include <RmlUi/Core/Core.h>
          #include <RmlUi/Core/ElementDocument.h>

          #include "RmlUi_Platform_SDL.h"
          #include "RmlUi_Renderer_GL3.h"

          int main(int argc, char** argv)
          {
              (void)argc;
              (void)argv;

              constexpr int initial_width = 1280;
              constexpr int initial_height = 720;

              // ====================================================
              // SDL
              // ====================================================

              if (!SDL_Init(
                      SDL_INIT_VIDEO |
                      SDL_INIT_EVENTS))
              {
                  return 1;
              }

              SDL_SetHint(
                  SDL_HINT_IME_IMPLEMENTED_UI,
                  "composition");

              SDL_SetHint(
                  SDL_HINT_MOUSE_FOCUS_CLICKTHROUGH,
                  "1");

              SDL_SetHint(
                  SDL_HINT_TOUCH_MOUSE_EVENTS,
                  "0");

              // ====================================================
              // OpenGL ES 3.2
              // ====================================================

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_FLAGS,
                  0);

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_PROFILE_MASK,
                  SDL_GL_CONTEXT_PROFILE_ES);

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MAJOR_VERSION,
                  3);

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MINOR_VERSION,
                  2);

              SDL_GL_SetAttribute(
                  SDL_GL_DOUBLEBUFFER,
                  1);

              // ====================================================
              // Android window
              // ====================================================

              float display_scale =
                  SDL_GetDisplayContentScale(
                      SDL_GetPrimaryDisplay());

              if (display_scale <= 0.0f)
              {
                  display_scale = 1.0f;
              }

              SDL_PropertiesID properties =
                  SDL_CreateProperties();

              if (properties == 0)
              {
                  SDL_Quit();
                  return 2;
              }

              SDL_SetStringProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_TITLE_STRING,
                  "Personal AI");

              SDL_SetNumberProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_X_NUMBER,
                  SDL_WINDOWPOS_CENTERED);

              SDL_SetNumberProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_Y_NUMBER,
                  SDL_WINDOWPOS_CENTERED);

              SDL_SetNumberProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_WIDTH_NUMBER,
                  static_cast<int>(
                      initial_width *
                      display_scale));

              SDL_SetNumberProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_HEIGHT_NUMBER,
                  static_cast<int>(
                      initial_height *
                      display_scale));

              SDL_SetBooleanProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_OPENGL_BOOLEAN,
                  true);

              SDL_SetBooleanProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_RESIZABLE_BOOLEAN,
                  true);

              SDL_SetBooleanProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_HIGH_PIXEL_DENSITY_BOOLEAN,
                  true);

              SDL_Window* window =
                  SDL_CreateWindowWithProperties(
                      properties);

              SDL_DestroyProperties(properties);

              if (window == nullptr)
              {
                  SDL_Quit();
                  return 3;
              }

              // ====================================================
              // OpenGL context
              // ====================================================

              SDL_GLContext gl_context =
                  SDL_GL_CreateContext(window);

              if (gl_context == nullptr)
              {
                  SDL_DestroyWindow(window);
                  SDL_Quit();
                  return 4;
              }

              if (!SDL_GL_MakeCurrent(
                      window,
                      gl_context))
              {
                  SDL_GL_DestroyContext(gl_context);
                  SDL_DestroyWindow(window);
                  SDL_Quit();
                  return 5;
              }

              SDL_GL_SetSwapInterval(1);

              // ====================================================
              // RmlUi OpenGL loader
              // ====================================================

              if (!RmlGL3::Initialize())
              {
                  SDL_GL_DestroyContext(gl_context);
                  SDL_DestroyWindow(window);
                  SDL_Quit();
                  return 6;
              }

              {
                  // ==================================================
                  // RmlUi interfaces
                  // ==================================================

                  SystemInterface_SDL system_interface(
                      window);

                  RenderInterface_GL3 render_interface;

                  if (!render_interface)
                  {
                      RmlGL3::Shutdown();

                      SDL_GL_DestroyContext(
                          gl_context);

                      SDL_DestroyWindow(window);
                      SDL_Quit();

                      return 7;
                  }

                  // ==================================================
                  // Actual drawable size
                  // ==================================================

                  int width = 0;
                  int height = 0;

                  if (!SDL_GetWindowSizeInPixels(
                          window,
                          &width,
                          &height))
                  {
                      width = initial_width;
                      height = initial_height;
                  }

                  if (width < 1)
                  {
                      width = initial_width;
                  }

                  if (height < 1)
                  {
                      height = initial_height;
                  }

                  render_interface.SetViewport(
                      width,
                      height);

                  // ==================================================
                  // Register RmlUi interfaces
                  // ==================================================

                  Rml::SetSystemInterface(
                      &system_interface);

                  Rml::SetRenderInterface(
                      &render_interface);

                  if (!Rml::Initialise())
                  {
                      RmlGL3::Shutdown();

                      SDL_GL_DestroyContext(
                          gl_context);

                      SDL_DestroyWindow(window);
                      SDL_Quit();

                      return 8;
                  }

                  // ==================================================
                  // Create RmlUi context
                  // ==================================================

                  Rml::Context* context =
                      Rml::CreateContext(
                          "main",
                          Rml::Vector2i(
                              width,
                              height));

                  if (context == nullptr)
                  {
                      Rml::Shutdown();

                      RmlGL3::Shutdown();

                      SDL_GL_DestroyContext(
                          gl_context);

                      SDL_DestroyWindow(window);
                      SDL_Quit();

                      return 9;
                  }

                  // ==================================================
                  // Density
                  // ==================================================

                  const float window_scale =
                      SDL_GetWindowDisplayScale(
                          window);

                  if (window_scale > 0.0f)
                  {
                      context->SetDensityIndependentPixelRatio(
                          window_scale);
                  }

                  // ==================================================
                  // Responsive test UI
                  // ==================================================

                  const Rml::String ui = R"rml(
                  <rml>

                    <head>

                      <style>

                        body
                        {
                          margin: 0px;

                          width: 100%;
                          height: 100%;

                          background-color: #0B1020;
                        }

                        .panel
                        {
                          position: absolute;

                          left: 8%;
                          top: 8%;

                          width: 84%;
                          height: 84%;

                          background-color: #151E38;

                          border: 2px solid #345CFF;

                          border-radius: 24px;
                        }

                        .accent
                        {
                          position: absolute;

                          left: 12%;
                          top: 14%;

                          width: 20%;
                          height: 7%;

                          background-color: #35D0BA;

                          border-radius: 14px;
                        }

                        .card1
                        {
                          position: absolute;

                          left: 12%;
                          top: 30%;

                          width: 34%;
                          height: 22%;

                          background-color: #202C4D;

                          border-radius: 18px;
                        }

                        .card2
                        {
                          position: absolute;

                          right: 12%;
                          top: 30%;

                          width: 34%;
                          height: 22%;

                          background-color: #202C4D;

                          border-radius: 18px;
                        }

                        .bottom
                        {
                          position: absolute;

                          left: 12%;
                          bottom: 14%;

                          width: 76%;
                          height: 8%;

                          background-color: #26365C;

                          border-radius: 16px;
                        }

                      </style>

                    </head>

                    <body>

                      <div class="panel">

                        <div class="accent"></div>

                        <div class="card1"></div>

                        <div class="card2"></div>

                        <div class="bottom"></div>

                      </div>

                    </body>

                  </rml>
                  )rml";

                  // ==================================================
                  // Load document
                  //
                  // IMPORTANT:
                  // ElementDocument.h is included above because
                  // Context.h only forward-declares ElementDocument.
                  // ==================================================

                  Rml::ElementDocument* document =
                      context->LoadDocumentFromMemory(
                          ui,
                          "[embedded-test-ui.rml]");

                  if (document == nullptr)
                  {
                      Rml::RemoveContext("main");
                      Rml::Shutdown();

                      RmlGL3::Shutdown();

                      SDL_GL_DestroyContext(
                          gl_context);

                      SDL_DestroyWindow(window);
                      SDL_Quit();

                      return 10;
                  }

                  document->Show();

                  // ==================================================
                  // Main loop
                  // ==================================================

                  bool running = true;

                  while (running)
                  {
                      SDL_Event event;

                      while (SDL_PollEvent(&event))
                      {
                          if (event.type ==
                              SDL_EVENT_QUIT)
                          {
                              running = false;
                              continue;
                          }

                          RmlSDL::InputEventHandler(
                              context,
                              window,
                              event);
                      }

                      // ----------------------------------------------
                      // Actual Android drawable size
                      // ----------------------------------------------

                      int new_width = 0;
                      int new_height = 0;

                      if (SDL_GetWindowSizeInPixels(
                              window,
                              &new_width,
                              &new_height))
                      {
                          if (new_width > 0 &&
                              new_height > 0 &&
                              (new_width != width ||
                               new_height != height))
                          {
                              width = new_width;
                              height = new_height;

                              // Update RmlUi logical context size.
                              context->SetDimensions(
                                  Rml::Vector2i(
                                      width,
                                      height));

                              // Update GL viewport/projection.
                              render_interface.SetViewport(
                                  width,
                                  height);
                          }
                      }

                      // ----------------------------------------------
                      // Update
                      // ----------------------------------------------

                      context->Update();

                      // ----------------------------------------------
                      // Render
                      // ----------------------------------------------

                      render_interface.Clear();

                      render_interface.BeginFrame();

                      context->Render();

                      render_interface.EndFrame();

                      SDL_GL_SwapWindow(window);
                  }

                  // ==================================================
                  // RmlUi shutdown
                  // ==================================================

                  Rml::RemoveContext("main");

                  Rml::Shutdown();
              }

              // ======================================================
              // GL + SDL shutdown
              // ======================================================

              RmlGL3::Shutdown();

              SDL_GL_DestroyContext(
                  gl_context);

              SDL_DestroyWindow(window);

              SDL_Quit();

              return 0;
          }
          CPP

      # ============================================================
      # Verify generated project
      # ============================================================

      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Android project"
          echo "========================================"

          test -f \
            "${ANDROID_PROJECT}/app/build.gradle"

          test -f \
            "${ANDROID_PROJECT}/app/jni/CMakeLists.txt"

          test -f \
            "${ANDROID_PROJECT}/app/jni/src/CMakeLists.txt"

          test -f \
            "${ANDROID_PROJECT}/app/jni/src/main.cpp"

          echo "Android project files: OK"

          echo
          echo "========================================"
          echo "SDL3"
          echo "========================================"

          test -f \
            "${ANDROID_PROJECT}/app/jni/SDL/include/SDL3/SDL.h"

          echo "SDL3 headers: OK"

          echo
          echo "========================================"
          echo "RmlUi"
          echo "========================================"

          test -f \
            "${ANDROID_PROJECT}/app/jni/RmlUi/CMakeLists.txt"

          test -f \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Backends/RmlUi_Platform_SDL.cpp"

          test -f \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Backends/RmlUi_Renderer_GL3.cpp"

          echo "RmlUi sources: OK"

          echo
          echo "========================================"
          echo "ElementDocument"
          echo "========================================"

          test -f \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Include/RmlUi/Core/ElementDocument.h"

          echo "ElementDocument.h: OK"

          echo
          echo "========================================"
          echo "FreeType"
          echo "========================================"

          test -f \
            "${ANDROID_PROJECT}/app/jni/freetype/CMakeLists.txt"

          echo "FreeType: OK"

          echo
          echo "========================================"
          echo "SDL3 definition"
          echo "========================================"

          grep -R \
            "RMLUI_SDL_VERSION_MAJOR=3" \
            "${ANDROID_PROJECT}/app/jni"

          echo
          echo "========================================"
          echo "Configuration"
          echo "========================================"

          echo "RmlUi       : ${RMLUI_VERSION}"
          echo "SDL3        : ${SDL_VERSION}"
          echo "FreeType    : ${FREETYPE_VERSION}"
          echo "Android API : ${ANDROID_API}"
          echo "Android NDK : ${ANDROID_NDK_VERSION}"
          echo "Android ABI : ${ANDROID_ABI}"
          echo "C++         : 20"
          echo "OpenGL ES   : 3.2"

      # ============================================================
      # Build
      # ============================================================

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            -PBUILD_WITH_CMAKE \
            assembleDebug \
            2>&1 | tee "${RUNNER_TEMP}/gradle-build.log"

      # ============================================================
      # Collect APK
      # ============================================================

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              "${ANDROID_PROJECT}/app/build/outputs/apk/debug" \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          test -n "${APK}"
          test -f "${APK}"

          cp \
            "${APK}" \
            "${GITHUB_WORKSPACE}/personal-ai-debug.apk"

          echo
          echo "========================================"
          echo "APK CREATED"
          echo "========================================"

          echo "${GITHUB_WORKSPACE}/personal-ai-debug.apk"

      # ============================================================
      # Upload APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultron-android-debug
          path: personal-ai-debug.apk
          if-no-files-found: error

      # ============================================================
      # Always upload diagnostics
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultron-build-diagnostics
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: warn
