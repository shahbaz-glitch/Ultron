name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: "Personal AI"

  RMLUI_VERSION: "6.3"
  SDL_VERSION: "3.4.16"
  SDL_IMAGE_VERSION: "3.4.6"
  FREETYPE_VERSION: "VER-2-14-1"

  ANDROID_API: "35"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_ABI: "arm64-v8a"

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout Ultron
      # ============================================================

      - name: Checkout Ultron
        uses: actions/checkout@v7

      # ============================================================
      # Java 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # Prepare fresh Android project + dependencies
      # ============================================================

      - name: Prepare Android project and dependencies
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_PROJECT="${RUNNER_TEMP}/android-project"

          rm -rf "${ANDROID_PROJECT}"
          rm -rf "${RUNNER_TEMP}/SDL"
          rm -rf "${RUNNER_TEMP}/SDL_image"
          rm -rf "${RUNNER_TEMP}/RmlUi"
          rm -rf "${RUNNER_TEMP}/freetype"

          # --------------------------------------------------------
          # SDL3
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "release-${SDL_VERSION}" \
            "https://github.com/libsdl-org/SDL.git" \
            "${RUNNER_TEMP}/SDL"

          cp -a \
            "${RUNNER_TEMP}/SDL/android-project" \
            "${ANDROID_PROJECT}"

          rm -rf \
            "${ANDROID_PROJECT}/app/jni/SDL"

          git clone \
            --depth 1 \
            --branch "release-${SDL_VERSION}" \
            "https://github.com/libsdl-org/SDL.git" \
            "${ANDROID_PROJECT}/app/jni/SDL"

          # --------------------------------------------------------
          # SDL3_image
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "release-${SDL_IMAGE_VERSION}" \
            "https://github.com/libsdl-org/SDL_image.git" \
            "${ANDROID_PROJECT}/app/jni/SDL_image"

          # --------------------------------------------------------
          # FreeType
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "${FREETYPE_VERSION}" \
            "https://github.com/freetype/freetype.git" \
            "${ANDROID_PROJECT}/app/jni/freetype"

          # --------------------------------------------------------
          # RmlUi 6.3
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "${RMLUI_VERSION}" \
            "https://github.com/mikke89/RmlUi.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi"

          # Remove git metadata from temporary dependency copies.
          rm -rf \
            "${ANDROID_PROJECT}/app/jni/SDL/.git" \
            "${ANDROID_PROJECT}/app/jni/SDL_image/.git" \
            "${ANDROID_PROJECT}/app/jni/freetype/.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi/.git"

          echo "ANDROID_PROJECT=${ANDROID_PROJECT}" >> "${GITHUB_ENV}"

      # ============================================================
      # Configure Android project
      # ============================================================

      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Application name
          # --------------------------------------------------------

          sed -i \
            's#<string name="app_name">[^<]*</string>#<string name="app_name">Personal AI</string>#' \
            "${ANDROID_PROJECT}/app/src/main/res/values/strings.xml"

          # --------------------------------------------------------
          # OpenGL ES 3.2
          # --------------------------------------------------------

          sed -i \
            's/android:glEsVersion="0x00020000"/android:glEsVersion="0x00030002"/' \
            "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml"

          # --------------------------------------------------------
          # C++20
          # --------------------------------------------------------

          sed -i \
            's/arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"/arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static", "-DCMAKE_CXX_STANDARD=20", "-DCMAKE_CXX_STANDARD_REQUIRED=ON", "-DCMAKE_CXX_EXTENSIONS=OFF"/' \
            "${ANDROID_PROJECT}/app/build.gradle"

          # --------------------------------------------------------
          # Gradle properties
          # --------------------------------------------------------

          cat > "${ANDROID_PROJECT}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

          # ========================================================
          # Main CMakeLists.txt
          # ========================================================

          cat > "${ANDROID_PROJECT}/app/jni/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)

          project(
              PersonalAI
              LANGUAGES C CXX
          )

          # ========================================================
          # Global C++20
          # ========================================================

          set(CMAKE_CXX_STANDARD 20 CACHE STRING "" FORCE)
          set(CMAKE_CXX_STANDARD_REQUIRED ON CACHE BOOL "" FORCE)
          set(CMAKE_CXX_EXTENSIONS OFF CACHE BOOL "" FORCE)

          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          # ========================================================
          # SDL3
          # ========================================================

          set(SDL_SHARED ON CACHE BOOL "" FORCE)
          set(SDL_STATIC OFF CACHE BOOL "" FORCE)

          set(SDL_TESTS OFF CACHE BOOL "" FORCE)
          set(SDL_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(SDL_INSTALL OFF CACHE BOOL "" FORCE)

          # RmlUi GL3 backend is used instead of SDL_GPU here.
          set(SDL_GPU OFF CACHE BOOL "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/SDL"
              SDL3
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # FreeType
          # ========================================================

          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)

          set(FT_DISABLE_ZLIB ON CACHE BOOL "" FORCE)
          set(FT_DISABLE_BZIP2 ON CACHE BOOL "" FORCE)
          set(FT_DISABLE_PNG ON CACHE BOOL "" FORCE)
          set(FT_DISABLE_HARFBUZZ ON CACHE BOOL "" FORCE)
          set(FT_DISABLE_BROTLI ON CACHE BOOL "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/freetype"
              freetype
              EXCLUDE_FROM_ALL
          )

          if(NOT TARGET Freetype::Freetype)
              add_library(
                  Freetype::Freetype
                  ALIAS
                  freetype
              )
          endif()

          # ========================================================
          # SDL3_image
          # ========================================================

          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)

          set(SDLIMAGE_INSTALL OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_SAMPLES OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_TESTS OFF CACHE BOOL "" FORCE)

          # We don't need SDL_image to download its own dependency
          # tree during this initial Android build.
          set(SDLIMAGE_VENDORED OFF CACHE BOOL "" FORCE)

          # Disable optional formats for minimal first build.
          set(SDLIMAGE_ANI OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_AVIF OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_BMP OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_GIF OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_JPG OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_JXL OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_LBM OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_PCX OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_PNG OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_PNM OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_QOI OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_SVG OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_TGA OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_TIF OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_WEBP OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_XCF OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_XPM OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_XV OFF CACHE BOOL "" FORCE)

          set(SDLIMAGE_ANI_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_AVIF_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_BMP_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_GIF_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_JPG_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_PNG_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_TGA_SAVE OFF CACHE BOOL "" FORCE)
          set(SDLIMAGE_WEBP_SAVE OFF CACHE BOOL "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/SDL_image"
              SDL3_image
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # RmlUi 6.3
          # ========================================================

          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)

          set(RMLUI_SAMPLES OFF CACHE BOOL "" FORCE)

          set(
              RMLUI_FONT_ENGINE
              "freetype"
              CACHE STRING
              ""
              FORCE
          )

          set(RMLUI_PRECOMPILED_HEADERS OFF CACHE BOOL "" FORCE)
          set(RMLUI_LUA_BINDINGS OFF CACHE BOOL "" FORCE)
          set(RMLUI_TRACY_PROFILING OFF CACHE BOOL "" FORCE)
          set(RMLUI_COMPILER_OPTIONS OFF CACHE BOOL "" FORCE)

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/RmlUi"
              RmlUi
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # Application
          # ========================================================

          add_subdirectory(src)
          CMAKE

          # ========================================================
          # Application CMakeLists.txt
          # ========================================================

          mkdir -p "${ANDROID_PROJECT}/app/jni/src"

          cat > "${ANDROID_PROJECT}/app/jni/src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)

          project(
              PersonalAIApp
              LANGUAGES CXX
          )

          add_library(
              main
              SHARED

              main.cpp

              ../RmlUi/Backends/RmlUi_Platform_SDL.cpp
              ../RmlUi/Backends/RmlUi_Renderer_GL3.cpp
              ../RmlUi/Backends/RmlUi_Backend_SDL_GL3.cpp
          )

          # ========================================================
          # Include paths
          # ========================================================

          target_include_directories(
              main
              PRIVATE

              ../RmlUi/Backends

              # RmlUi_Backend_SDL_GL3.cpp directly includes
              # <SDL3_image/SDL_image.h>.
              ../SDL_image/include
          )

          # ========================================================
          # C++20
          # ========================================================

          target_compile_features(
              main
              PRIVATE
              cxx_std_20
          )

          # ========================================================
          # IMPORTANT:
          # Tell the RmlUi SDL backend that we are using SDL3.
          # ========================================================

          target_compile_definitions(
              main
              PRIVATE
              RMLUI_SDL_VERSION_MAJOR=3
          )

          # ========================================================
          # Libraries
          # ========================================================

          target_link_libraries(
              main
              PRIVATE

              RmlUi::RmlUi

              SDL3::SDL3
              SDL3_image::SDL3_image

              GLESv3
              android
              log
          )
          CMAKE

          # ========================================================
          # Main application source
          # ========================================================

          cat > "${ANDROID_PROJECT}/app/jni/src/main.cpp" <<'CPP'
          #include <SDL3/SDL.h>

          #include <RmlUi/Core/Context.h>
          #include <RmlUi/Core/Core.h>

          #include "RmlUi_Backend.h"

          int main(int argc, char** argv)
          {
              (void)argc;
              (void)argv;

              constexpr int initial_width = 1280;
              constexpr int initial_height = 720;

              // ----------------------------------------------------
              // Initialize SDL + RmlUi OpenGL ES 3 backend.
              //
              // allow_resize = true so the window can adapt.
              // ----------------------------------------------------

              if (!Backend::Initialize(
                      "Personal AI",
                      initial_width,
                      initial_height,
                      true))
              {
                  return 1;
              }

              // ----------------------------------------------------
              // Register RmlUi interfaces.
              // ----------------------------------------------------

              Rml::SetSystemInterface(
                  Backend::GetSystemInterface());

              Rml::SetRenderInterface(
                  Backend::GetRenderInterface());

              if (!Rml::Initialise())
              {
                  Backend::Shutdown();
                  return 2;
              }

              // ----------------------------------------------------
              // Get the SDL window.
              // ----------------------------------------------------

              int window_count = 0;

              SDL_Window** windows =
                  SDL_GetWindows(&window_count);

              SDL_Window* window = nullptr;

              if (windows && window_count > 0)
              {
                  window = windows[0];
              }

              if (windows)
              {
                  SDL_free(windows);
              }

              if (!window)
              {
                  Rml::Shutdown();
                  Backend::Shutdown();
                  return 3;
              }

              // ----------------------------------------------------
              // Get actual drawable pixel dimensions.
              //
              // This makes the RmlUi context follow the real
              // Android display rather than staying locked to
              // 1280x720.
              // ----------------------------------------------------

              int window_width = initial_width;
              int window_height = initial_height;

              SDL_GetWindowSizeInPixels(
                  window,
                  &window_width,
                  &window_height);

              if (window_width < 1)
              {
                  window_width = initial_width;
              }

              if (window_height < 1)
              {
                  window_height = initial_height;
              }

              // ----------------------------------------------------
              // Create RmlUi context using actual window size.
              // ----------------------------------------------------

              Rml::Context* context =
                  Rml::CreateContext(
                      "main",
                      Rml::Vector2i(
                          window_width,
                          window_height));

              if (!context)
              {
                  Rml::Shutdown();
                  Backend::Shutdown();
                  return 4;
              }

              // ----------------------------------------------------
              // Initial responsive UI.
              // ----------------------------------------------------

              const Rml::String ui = R"rml(
              <rml>

                <head>

                  <style>

                    body
                    {
                      margin: 0px;

                      width: 100%;
                      height: 100%;

                      background-color: #0B1020;
                    }

                    .panel
                    {
                      position: absolute;

                      left: 8%;
                      top: 8%;

                      width: 84%;
                      height: 84%;

                      background-color: #151E38;

                      border: 2px solid #345CFF;

                      border-radius: 24px;
                    }

                    .accent
                    {
                      position: absolute;

                      left: 12%;
                      top: 14%;

                      width: 20%;
                      height: 7%;

                      background-color: #35D0BA;

                      border-radius: 14px;
                    }

                    .card1
                    {
                      position: absolute;

                      left: 12%;
                      top: 30%;

                      width: 34%;
                      height: 22%;

                      background-color: #202C4D;

                      border-radius: 18px;
                    }

                    .card2
                    {
                      position: absolute;

                      right: 12%;
                      top: 30%;

                      width: 34%;
                      height: 22%;

                      background-color: #202C4D;

                      border-radius: 18px;
                    }

                    .bottom
                    {
                      position: absolute;

                      left: 12%;
                      bottom: 14%;

                      width: 76%;
                      height: 8%;

                      background-color: #26365C;

                      border-radius: 16px;
                    }

                  </style>

                </head>

                <body>

                  <div class="panel">

                    <div class="accent"></div>

                    <div class="card1"></div>

                    <div class="card2"></div>

                    <div class="bottom"></div>

                  </div>

                </body>

              </rml>
              )rml";

              // ----------------------------------------------------
              // Load embedded UI.
              // ----------------------------------------------------

              Rml::ElementDocument* document =
                  context->LoadDocumentFromMemory(
                      ui,
                      "[embedded-test-ui.rml]");

              if (!document)
              {
                  Rml::RemoveContext("main");
                  Rml::Shutdown();
                  Backend::Shutdown();
                  return 5;
              }

              document->Show();

              // ----------------------------------------------------
              // Main loop.
              // ----------------------------------------------------

              while (Backend::ProcessEvents(
                  context,
                  nullptr,
                  false))
              {
                  // ------------------------------------------------
                  // Query actual drawable size every frame.
                  //
                  // This catches:
                  // - portrait
                  // - landscape
                  // - rotation
                  // - Android resize
                  // - different display densities/sizes
                  // ------------------------------------------------

                  int new_width = 0;
                  int new_height = 0;

                  if (SDL_GetWindowSizeInPixels(
                          window,
                          &new_width,
                          &new_height))
                  {
                      if (new_width > 0 &&
                          new_height > 0 &&
                          (new_width != window_width ||
                           new_height != window_height))
                      {
                          window_width = new_width;
                          window_height = new_height;

                          context->SetDimensions(
                              Rml::Vector2i(
                                  window_width,
                                  window_height));
                      }
                  }

                  // ------------------------------------------------
                  // Update + render.
                  // ------------------------------------------------

                  context->Update();

                  Backend::BeginFrame();

                  context->Render();

                  Backend::PresentFrame();
              }

              // ----------------------------------------------------
              // Shutdown.
              // ----------------------------------------------------

              Rml::RemoveContext("main");

              Rml::Shutdown();

              Backend::Shutdown();

              return 0;
          }
          CPP

      # ============================================================
      # Diagnostics
      # ============================================================

      - name: Verify toolchain and dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Java"
          echo "========================================"

          java -version

          echo
          echo "========================================"
          echo "Gradle"
          echo "========================================"

          grep "distributionUrl=" \
            "${ANDROID_PROJECT}/gradle/wrapper/gradle-wrapper.properties"

          echo
          echo "========================================"
          echo "Android SDK"
          echo "========================================"

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          echo
          echo "========================================"
          echo "Android NDK"
          echo "========================================"

          test -d \
            "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          echo \
            "NDK ${ANDROID_NDK_VERSION} found"

          echo
          echo "========================================"
          echo "Dependencies"
          echo "========================================"

          echo "RmlUi      : ${RMLUI_VERSION}"
          echo "SDL3       : ${SDL_VERSION}"
          echo "SDL3_image : ${SDL_IMAGE_VERSION}"
          echo "FreeType   : ${FREETYPE_VERSION}"
          echo "Android ABI: ${ANDROID_ABI}"

      # ============================================================
      # Build
      # ============================================================

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -PBUILD_WITH_CMAKE \
            assembleDebug

      # ============================================================
      # Collect APK
      # ============================================================

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              "${ANDROID_PROJECT}/app/build/outputs/apk/debug" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          test -n "${APK}"
          test -f "${APK}"

          cp \
            "${APK}" \
            "${GITHUB_WORKSPACE}/personal-ai-debug.apk"

          echo "APK created:"
          echo "${GITHUB_WORKSPACE}/personal-ai-debug.apk"

      # ============================================================
      # Upload APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ultron-android-debug
          path: personal-ai-debug.apk
          if-no-files-found: error
