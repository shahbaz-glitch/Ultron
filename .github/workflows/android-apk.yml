name: Build Ultron Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultron-android-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "Ultron"
  APPLICATION_ID: "com.shahbazglitch.ultron"

  RMLUI_VERSION: "6.3"
  SDL_VERSION: "3.4.16"
  FREETYPE_VERSION: "VER-2-14-1"

  ANDROID_API: "35"
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_ABI: "arm64-v8a"

  BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  build-android:
    name: Build Ultron
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout Ultron
        uses: actions/checkout@v7

      # ============================================================
      # Java 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # Android SDK
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # ============================================================
      # Prepare fresh Android project
      # ============================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_PROJECT="${RUNNER_TEMP}/android-project"

          rm -rf "${ANDROID_PROJECT}"
          rm -rf "${RUNNER_TEMP}/SDL"

          # --------------------------------------------------------
          # SDL3 3.4.16
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "release-${SDL_VERSION}" \
            "https://github.com/libsdl-org/SDL.git" \
            "${RUNNER_TEMP}/SDL"

          cp -a \
            "${RUNNER_TEMP}/SDL/android-project" \
            "${ANDROID_PROJECT}"

          rm -rf \
            "${ANDROID_PROJECT}/app/jni/SDL"

          git clone \
            --depth 1 \
            --branch "release-${SDL_VERSION}" \
            "https://github.com/libsdl-org/SDL.git" \
            "${ANDROID_PROJECT}/app/jni/SDL"

          # --------------------------------------------------------
          # FreeType 2.14.1
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "${FREETYPE_VERSION}" \
            "https://github.com/freetype/freetype.git" \
            "${ANDROID_PROJECT}/app/jni/freetype"

          # --------------------------------------------------------
          # RmlUi 6.3
          # --------------------------------------------------------

          git clone \
            --depth 1 \
            --branch "${RMLUI_VERSION}" \
            "https://github.com/mikke89/RmlUi.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi"

          # --------------------------------------------------------
          # Remove git metadata
          # --------------------------------------------------------

          rm -rf \
            "${ANDROID_PROJECT}/app/jni/SDL/.git" \
            "${ANDROID_PROJECT}/app/jni/freetype/.git" \
            "${ANDROID_PROJECT}/app/jni/RmlUi/.git"

          echo "ANDROID_PROJECT=${ANDROID_PROJECT}" >> "${GITHUB_ENV}"

      # ============================================================
      # Configure Android project
      # ============================================================

      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail

          # ========================================================
          # Application name
          # ========================================================

          sed -i \
            "s#<string name=\"app_name\">[^<]*</string>#<string name=\"app_name\">${APP_NAME}</string>#" \
            "${ANDROID_PROJECT}/app/src/main/res/values/strings.xml"

          # ========================================================
          # OpenGL ES 3.2
          # ========================================================

          sed -i \
            's/android:glEsVersion="0x00020000"/android:glEsVersion="0x00030002"/' \
            "${ANDROID_PROJECT}/app/src/main/AndroidManifest.xml"

          # ========================================================
          # CMake / C++20
          # ========================================================

          sed -i \
            's/arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"/arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static", "-DCMAKE_CXX_STANDARD=20", "-DCMAKE_CXX_STANDARD_REQUIRED=ON", "-DCMAKE_CXX_EXTENSIONS=OFF"/' \
            "${ANDROID_PROJECT}/app/build.gradle"

          # ========================================================
          # Gradle properties
          # ========================================================

          cat > \
            "${ANDROID_PROJECT}/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4096m
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

          # ========================================================
          # Main CMakeLists.txt
          # ========================================================

          cat > \
            "${ANDROID_PROJECT}/app/jni/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)

          project(
              Ultron
              LANGUAGES C CXX
          )

          # ========================================================
          # C++20
          # ========================================================

          set(
              CMAKE_CXX_STANDARD
              20
              CACHE STRING
              ""
              FORCE
          )

          set(
              CMAKE_CXX_STANDARD_REQUIRED
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              CMAKE_CXX_EXTENSIONS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              CMAKE_POSITION_INDEPENDENT_CODE
              ON
          )

          set(
              CMAKE_EXPORT_COMPILE_COMMANDS
              ON
              CACHE BOOL
              ""
              FORCE
          )

          # ========================================================
          # RmlUi SDL3
          # ========================================================

          add_compile_definitions(
              RMLUI_SDL_VERSION_MAJOR=3
          )

          # ========================================================
          # SDL3
          # ========================================================

          set(
              SDL_SHARED
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_STATIC
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_TESTS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_EXAMPLES
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_INSTALL
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              SDL_GPU
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/SDL"
              SDL3
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # FreeType
          # ========================================================

          set(
              BUILD_SHARED_LIBS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_ZLIB
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_BZIP2
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_PNG
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_HARFBUZZ
              ON
              CACHE BOOL
              ""
              FORCE
          )

          set(
              FT_DISABLE_BROTLI
              ON
              CACHE BOOL
              ""
              FORCE
          )

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/freetype"
              freetype
              EXCLUDE_FROM_ALL
          )

          if(NOT TARGET Freetype::Freetype)
              add_library(
                  Freetype::Freetype
                  ALIAS
                  freetype
              )
          endif()

          # ========================================================
          # RmlUi 6.3
          # ========================================================

          set(
              BUILD_SHARED_LIBS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_SAMPLES
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_FONT_ENGINE
              "freetype"
              CACHE STRING
              ""
              FORCE
          )

          set(
              RMLUI_PRECOMPILED_HEADERS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_LUA_BINDINGS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_TRACY_PROFILING
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          set(
              RMLUI_COMPILER_OPTIONS
              OFF
              CACHE BOOL
              ""
              FORCE
          )

          add_subdirectory(
              "${CMAKE_CURRENT_LIST_DIR}/RmlUi"
              RmlUi
              EXCLUDE_FROM_ALL
          )

          # ========================================================
          # Application
          # ========================================================

          add_subdirectory(src)
          CMAKE

          # ========================================================
          # Application CMakeLists.txt
          # ========================================================

          mkdir -p \
            "${ANDROID_PROJECT}/app/jni/src"

          cat > \
            "${ANDROID_PROJECT}/app/jni/src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.16)

          project(
              UltronApp
              LANGUAGES CXX
          )

          add_library(
              main
              SHARED

              main.cpp

              ../RmlUi/Backends/RmlUi_Platform_SDL.cpp
              ../RmlUi/Backends/RmlUi_Renderer_GL3.cpp
          )

          target_include_directories(
              main
              PRIVATE

              ../RmlUi/Backends
          )

          target_compile_features(
              main
              PRIVATE
              cxx_std_20
          )

          target_compile_definitions(
              main
              PRIVATE
              RMLUI_SDL_VERSION_MAJOR=3
          )

          target_link_libraries(
              main
              PRIVATE

              RmlUi::RmlUi
              SDL3::SDL3-shared

              GLESv3
              android
              log
              ${CMAKE_DL_LIBS}
          )
          CMAKE

          # ========================================================
          # Native application
          # ========================================================

          cat > \
            "${ANDROID_PROJECT}/app/jni/src/main.cpp" <<'CPP'
          #include <SDL3/SDL.h>
          #include <SDL3/SDL_main.h>

          #include <RmlUi/Core/Context.h>
          #include <RmlUi/Core/Core.h>
          #include <RmlUi/Core/ElementDocument.h>

          #include "RmlUi_Platform_SDL.h"
          #include "RmlUi_Renderer_GL3.h"

          namespace
          {
              int Fail(
                  SDL_Window* window,
                  SDL_GLContext gl_context,
                  int code,
                  const char* message)
              {
                  SDL_LogError(
                      SDL_LOG_CATEGORY_APPLICATION,
                      "Ultron startup failure: %s",
                      message);

                  const char* sdl_error = SDL_GetError();

                  if (sdl_error != nullptr &&
                      sdl_error[0] != '\0')
                  {
                      SDL_LogError(
                          SDL_LOG_CATEGORY_APPLICATION,
                          "SDL error: %s",
                          sdl_error);
                  }

                  if (gl_context != nullptr)
                  {
                      SDL_GL_DestroyContext(gl_context);
                  }

                  if (window != nullptr)
                  {
                      SDL_DestroyWindow(window);
                  }

                  SDL_Quit();

                  return code;
              }
          }

          int main(int argc, char** argv)
          {
              (void)argc;
              (void)argv;

              constexpr int initial_width = 1280;
              constexpr int initial_height = 720;

              SDL_SetLogPriority(
                  SDL_LOG_CATEGORY_APPLICATION,
                  SDL_LOG_PRIORITY_INFO);

              SDL_Log("Ultron starting...");

              // ====================================================
              // SDL
              // ====================================================

              if (!SDL_Init(
                      SDL_INIT_VIDEO |
                      SDL_INIT_EVENTS))
              {
                  return Fail(
                      nullptr,
                      nullptr,
                      1,
                      "SDL_Init failed");
              }

              SDL_SetHint(
                  SDL_HINT_IME_IMPLEMENTED_UI,
                  "composition");

              SDL_SetHint(
                  SDL_HINT_MOUSE_FOCUS_CLICKTHROUGH,
                  "1");

              SDL_SetHint(
                  SDL_HINT_TOUCH_MOUSE_EVENTS,
                  "0");

              // ====================================================
              // OpenGL ES 3.2
              // ====================================================

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_FLAGS,
                  0);

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_PROFILE_MASK,
                  SDL_GL_CONTEXT_PROFILE_ES);

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MAJOR_VERSION,
                  3);

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MINOR_VERSION,
                  2);

              SDL_GL_SetAttribute(
                  SDL_GL_DOUBLEBUFFER,
                  1);

              // ====================================================
              // Initial display scale
              // ====================================================

              float display_scale =
                  SDL_GetDisplayContentScale(
                      SDL_GetPrimaryDisplay());

              if (display_scale <= 0.0f)
              {
                  display_scale = 1.0f;
              }

              // ====================================================
              // Window properties
              // ====================================================

              SDL_PropertiesID properties =
                  SDL_CreateProperties();

              if (properties == 0)
              {
                  return Fail(
                      nullptr,
                      nullptr,
                      2,
                      "SDL_CreateProperties failed");
              }

              SDL_SetStringProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_TITLE_STRING,
                  "Ultron");

              SDL_SetNumberProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_X_NUMBER,
                  SDL_WINDOWPOS_CENTERED);

              SDL_SetNumberProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_Y_NUMBER,
                  SDL_WINDOWPOS_CENTERED);

              SDL_SetNumberProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_WIDTH_NUMBER,
                  static_cast<int>(
                      initial_width * display_scale));

              SDL_SetNumberProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_HEIGHT_NUMBER,
                  static_cast<int>(
                      initial_height * display_scale));

              SDL_SetBooleanProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_OPENGL_BOOLEAN,
                  true);

              SDL_SetBooleanProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_RESIZABLE_BOOLEAN,
                  true);

              SDL_SetBooleanProperty(
                  properties,
                  SDL_PROP_WINDOW_CREATE_HIGH_PIXEL_DENSITY_BOOLEAN,
                  true);

              SDL_Window* window =
                  SDL_CreateWindowWithProperties(
                      properties);

              SDL_DestroyProperties(
                  properties);

              if (window == nullptr)
              {
                  return Fail(
                      nullptr,
                      nullptr,
                      3,
                      "SDL_CreateWindowWithProperties failed");
              }

              // ====================================================
              // OpenGL context
              // ====================================================

              SDL_GLContext gl_context =
                  SDL_GL_CreateContext(window);

              if (gl_context == nullptr)
              {
                  return Fail(
                      window,
                      nullptr,
                      4,
                      "SDL_GL_CreateContext failed");
              }

              if (!SDL_GL_MakeCurrent(
                      window,
                      gl_context))
              {
                  return Fail(
                      window,
                      gl_context,
                      5,
                      "SDL_GL_MakeCurrent failed");
              }

              SDL_GL_SetSwapInterval(1);

              SDL_Log(
                  "OpenGL context created.");

              // ====================================================
              // RmlUi GL3
              // ====================================================

              if (!RmlGL3::Initialize())
              {
                  return Fail(
                      window,
                      gl_context,
                      6,
                      "RmlGL3::Initialize failed");
              }

              {
                  SystemInterface_SDL system_interface(
                      window);

                  RenderInterface_GL3 render_interface;

                  // ==================================================
                  // Drawable size
                  // ==================================================

                  int width = 0;
                  int height = 0;

                  if (!SDL_GetWindowSizeInPixels(
                          window,
                          &width,
                          &height))
                  {
                      width = initial_width;
                      height = initial_height;
                  }

                  if (width < 1)
                  {
                      width = initial_width;
                  }

                  if (height < 1)
                  {
                      height = initial_height;
                  }

                  render_interface.SetViewport(
                      width,
                      height);

                  // ==================================================
                  // RmlUi interfaces
                  // ==================================================

                  Rml::SetSystemInterface(
                      &system_interface);

                  Rml::SetRenderInterface(
                      &render_interface);

                  if (!Rml::Initialise())
                  {
                      RmlGL3::Shutdown();

                      return Fail(
                          window,
                          gl_context,
                          7,
                          "Rml::Initialise failed");
                  }

                  // ==================================================
                  // RmlUi context
                  // ==================================================

                  Rml::Context* context =
                      Rml::CreateContext(
                          "main",
                          Rml::Vector2i(
                              width,
                              height));

                  if (context == nullptr)
                  {
                      Rml::Shutdown();
                      RmlGL3::Shutdown();

                      return Fail(
                          window,
                          gl_context,
                          8,
                          "Rml::CreateContext failed");
                  }

                  const float window_scale =
                      SDL_GetWindowDisplayScale(
                          window);

                  if (window_scale > 0.0f)
                  {
                      context->SetDensityIndependentPixelRatio(
                          window_scale);
                  }

                  // ==================================================
                  // Responsive test UI
                  // ==================================================

                  const Rml::String ui = R"rml(
                  <rml>

                    <head>

                      <style>

                        body
                        {
                          margin: 0px;
                          width: 100%;
                          height: 100%;

                          background-color: #080B14;
                          color: #EAF0FF;
                        }

                        .panel
                        {
                          position: absolute;

                          left: 6%;
                          top: 6%;

                          width: 88%;
                          height: 88%;

                          background-color: #111827;

                          border: 2px solid #26385F;

                          border-radius: 26px;
                        }

                        .top
                        {
                          position: absolute;

                          left: 5%;
                          top: 5%;

                          width: 90%;
                          height: 13%;

                          background-color: #16213B;

                          border-radius: 18px;
                        }

                        .indicator
                        {
                          position: absolute;

                          left: 5%;
                          top: 24%;

                          width: 90%;
                          height: 2%;

                          background-color: #35D0BA;

                          border-radius: 10px;
                        }

                        .card_left
                        {
                          position: absolute;

                          left: 5%;
                          top: 31%;

                          width: 42%;
                          height: 33%;

                          background-color: #182440;

                          border-radius: 20px;

                          border: 1px solid #2A3D68;
                        }

                        .card_right
                        {
                          position: absolute;

                          right: 5%;
                          top: 31%;

                          width: 42%;
                          height: 33%;

                          background-color: #182440;

                          border-radius: 20px;

                          border: 1px solid #2A3D68;
                        }

                        .footer
                        {
                          position: absolute;

                          left: 5%;
                          bottom: 5%;

                          width: 90%;
                          height: 11%;

                          background-color: #14203A;

                          border-radius: 16px;
                        }

                      </style>

                    </head>

                    <body>

                      <div class="panel">

                        <div class="top"></div>

                        <div class="indicator"></div>

                        <div class="card_left"></div>

                        <div class="card_right"></div>

                        <div class="footer"></div>

                      </div>

                    </body>

                  </rml>
                  )rml";

                  // ==================================================
                  // Load UI
                  // ==================================================

                  Rml::ElementDocument* document =
                      context->LoadDocumentFromMemory(
                          ui,
                          "[embedded-ultron-ui.rml]");

                  if (document == nullptr)
                  {
                      Rml::RemoveContext("main");
                      Rml::Shutdown();
                      RmlGL3::Shutdown();

                      return Fail(
                          window,
                          gl_context,
                          9,
                          "LoadDocumentFromMemory failed");
                  }

                  document->Show();

                  SDL_Log(
                      "Ultron UI initialized.");

                  // ==================================================
                  // Main loop
                  // ==================================================

                  bool running = true;

                  while (running)
                  {
                      SDL_Event event;

                      while (SDL_PollEvent(&event))
                      {
                          if (event.type ==
                              SDL_EVENT_QUIT)
                          {
                              running = false;
                              continue;
                          }

                          RmlSDL::InputEventHandler(
                              context,
                              window,
                              event);
                      }

                      // ----------------------------------------------
                      // Responsive drawable size
                      // ----------------------------------------------

                      int new_width = 0;
                      int new_height = 0;

                      if (SDL_GetWindowSizeInPixels(
                              window,
                              &new_width,
                              &new_height))
                      {
                          if (new_width > 0 &&
                              new_height > 0 &&
                              (new_width != width ||
                               new_height != height))
                          {
                              width = new_width;
                              height = new_height;

                              context->SetDimensions(
                                  Rml::Vector2i(
                                      width,
                                      height));

                              render_interface.SetViewport(
                                  width,
                                  height);
                          }
                      }

                      // ----------------------------------------------
                      // Update
                      // ----------------------------------------------

                      context->Update();

                      // ----------------------------------------------
                      // Render
                      // ----------------------------------------------

                      render_interface.Clear();

                      render_interface.BeginFrame();

                      context->Render();

                      render_interface.EndFrame();

                      SDL_GL_SwapWindow(
                          window);
                  }

                  // ==================================================
                  // RmlUi shutdown
                  // ==================================================

                  Rml::RemoveContext(
                      "main");

                  Rml::Shutdown();
              }

              // ======================================================
              // GL + SDL shutdown
              // ======================================================

              RmlGL3::Shutdown();

              SDL_GL_DestroyContext(
                  gl_context);

              SDL_DestroyWindow(
                  window);

              SDL_Quit();

              SDL_Log(
                  "Ultron shutdown cleanly.");

              return 0;
          }
          CPP

      # ============================================================
      # Verify generated project
      # ============================================================

      - name: Verify generated project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Ultron configuration"
          echo "========================================"

          echo "App name    : ${APP_NAME}"
          echo "Package     : ${APPLICATION_ID}"
          echo "RmlUi       : ${RMLUI_VERSION}"
          echo "SDL3        : ${SDL_VERSION}"
          echo "FreeType    : ${FREETYPE_VERSION}"
          echo "Android API : ${ANDROID_API}"
          echo "NDK         : ${ANDROID_NDK_VERSION}"
          echo "ABI         : ${ANDROID_ABI}"
          echo "C++         : 20"
          echo "OpenGL ES   : 3.2"

          echo
          echo "Checking project files..."

          test -f \
            "${ANDROID_PROJECT}/app/build.gradle"

          test -f \
            "${ANDROID_PROJECT}/app/jni/CMakeLists.txt"

          test -f \
            "${ANDROID_PROJECT}/app/jni/src/CMakeLists.txt"

          test -f \
            "${ANDROID_PROJECT}/app/jni/src/main.cpp"

          echo "Android project: OK"

          echo
          echo "Checking SDL3..."

          test -f \
            "${ANDROID_PROJECT}/app/jni/SDL/include/SDL3/SDL.h"

          test -f \
            "${ANDROID_PROJECT}/app/jni/SDL/include/SDL3/SDL_main.h"

          echo "SDL3: OK"

          echo
          echo "Checking RmlUi..."

          test -f \
            "${ANDROID_PROJECT}/app/jni/RmlUi/CMakeLists.txt"

          test -f \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Backends/RmlUi_Platform_SDL.cpp"

          test -f \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Backends/RmlUi_Renderer_GL3.cpp"

          test -f \
            "${ANDROID_PROJECT}/app/jni/RmlUi/Include/RmlUi/Core/ElementDocument.h"

          echo "RmlUi: OK"

          echo
          echo "Checking FreeType..."

          test -f \
            "${ANDROID_PROJECT}/app/jni/freetype/CMakeLists.txt"

          echo "FreeType: OK"

          echo
          echo "Checking SDL main entry point..."

          grep -q \
            '#include <SDL3/SDL_main.h>' \
            "${ANDROID_PROJECT}/app/jni/src/main.cpp"

          echo "SDL_main.h: OK"

          echo
          echo "Checking RmlUi SDL3 definition..."

          grep -R \
            "RMLUI_SDL_VERSION_MAJOR=3" \
            "${ANDROID_PROJECT}/app/jni"

          echo
          echo "Generated project verification: PASSED"

      # ============================================================
      # Build Debug APK
      # ============================================================

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            -PBUILD_WITH_CMAKE \
            assembleDebug \
            2>&1 | tee "${RUNNER_TEMP}/gradle-build.log"

      # ============================================================
      # Validate APK
      # ============================================================

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              "${ANDROID_PROJECT}/app/build/outputs/apk/debug" \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

          test -n "${APK}"
          test -f "${APK}"

          mkdir -p \
            "${GITHUB_WORKSPACE}/artifacts"

          cp \
            "${APK}" \
            "${GITHUB_WORKSPACE}/artifacts/ultron-debug.apk"

          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt" \
            dump badging \
            "${GITHUB_WORKSPACE}/artifacts/ultron-debug.apk" \
            | tee "${RUNNER_TEMP}/apk-badging.txt"

          grep -q \
            "com.shahbazglitch.ultron" \
            "${RUNNER_TEMP}/apk-badging.txt"

          echo
          echo "========================================"
          echo "APK VALIDATION PASSED"
          echo "========================================"

          ls -lh \
            "${GITHUB_WORKSPACE}/artifacts/ultron-debug.apk"

      # ============================================================
      # Upload APK
      # ============================================================

      - name: Upload Ultron APK
        uses: actions/upload-artifact@v7
        with:
          name: ultron-android-debug
          path: artifacts/ultron-debug.apk
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # Upload diagnostics
      # ============================================================

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ultron-build-diagnostics
          path: |
            ${{ runner.temp }}/gradle-build.log
            ${{ runner.temp }}/apk-badging.txt
          if-no-files-found: warn
